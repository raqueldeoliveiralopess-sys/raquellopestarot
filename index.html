<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimório Arcano</title>
<meta name="theme-color" content="#402327" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimório">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--paper:#F4ECE1;--card:#FFFDF9;--line:#E2D3C2;--ink:#402327;--ink2:#5E4038;--muted:#7A5A4E;--wood:#593122;--caramel:#AD7E62;--pink:#F4B1C8;--butter:#ECDF90;--sand:#EDE1D2;--green:#3F6E4A;--green-bg:#EAF2EA;--red:#7E2C2C;--red-bg:#FBEDED}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
#app{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;min-height:0;position:relative}
#topbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:rgba(244,236,225,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
button:active{opacity:.85}
main>*{flex-shrink:0}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 28px;display:flex;flex-direction:column;gap:18px}
nav{display:grid;grid-template-columns:repeat(var(--tabs,5),1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));flex-shrink:0}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;padding:6px 0;border:none;background:transparent;color:#A0857A;font-size:10.5px;font-weight:500}
nav[style*="--tabs: 6"] button{font-size:10px;letter-spacing:-.01em}
nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn{min-height:52px;border:none;border-radius:14px;background:var(--wood);color:var(--paper);font-size:16px;font-weight:600;width:100%}
.btn.ghost{background:var(--card);color:var(--wood);border:1px solid var(--line);min-height:48px;font-size:15px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;min-height:96px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;width:100%}
.tile b{font-size:16px;font-weight:600}.tile small{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%}
.row img{width:40px;height:66px;object-fit:cover;border-radius:6px;background:var(--sand);flex-shrink:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .n{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:99px;background:#5E8C61;display:inline-block}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills.wrap{flex-wrap:wrap;overflow:visible}
.pill{min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid #D9C7B3;background:var(--card);color:var(--wood);font-size:13px;font-weight:500;white-space:nowrap}
.pill.on{border-color:var(--ink);background:var(--ink);color:var(--butter);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--sand);overflow:hidden}.bar i{display:block;height:100%;background:var(--caramel);border-radius:99px}
.dark{background:var(--ink);color:var(--paper);border-radius:20px;padding:18px}
.dark .bar{background:rgba(244,236,225,.18)}
.mod{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:72px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;width:100%}
.mod .g{width:44px;height:44px;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--caramel);flex-shrink:0}
.mod .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chip{padding:6px 10px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:12px;font-weight:500}
.box{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.box.dark{border:none;background:var(--ink);color:var(--paper)}
.notes{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#FBF3E4;border:1px solid #E8D6B8}
.notes textarea{width:100%;min-height:140px;padding:12px;border:1px solid #E2D3C2;border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;resize:vertical}
.notes textarea:focus{outline:2px solid var(--caramel);outline-offset:1px}
.mchat{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;padding:2px}
.mb{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.mb.q{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.mb.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.mb.a.esc:empty::after{content:'…';letter-spacing:2px;color:var(--muted);animation:pulsaPonto 1.2s ease-in-out infinite}
@keyframes pulsaPonto{0%,100%{opacity:.35}50%{opacity:1}}
.mentora textarea{min-height:72px}
.mrow{display:flex;gap:6px;align-items:flex-end;max-width:92%}
.mrow .mb{max-width:100%}
.mav{flex:0 0 24px;width:24px;height:24px;margin-bottom:2px}
.mav svg,.mtit svg{width:100%;height:100%;display:block}
.mtit{display:flex;align-items:center;gap:10px}
.mtit span{flex:0 0 32px;width:32px;height:32px}
.notes .st{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;min-height:20px}
.link{border:none;background:transparent;color:var(--wood);font-size:13px;font-weight:600;padding:8px 4px;min-height:44px}
.box .h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.li{font-size:13px;line-height:1.4;padding-left:10px;border-left:2px solid var(--butter)}
.dark .li{border-color:var(--pink)}
p{margin:0;font-size:15px;line-height:1.5}
.sym{display:flex;gap:10px;font-size:14px;line-height:1.45}.sym i{width:6px;height:6px;border-radius:99px;background:var(--caramel);margin-top:7px;flex-shrink:0}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--wood);display:flex;align-items:center;justify-content:center}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:420px;padding:20px;border:1px solid var(--line);border-radius:22px;background:var(--card);text-align:center;width:100%}
.flash.back{background:var(--ink);color:var(--paper)}
.flash img{width:170px;height:280px;object-fit:cover;border-radius:10px;box-shadow:0 10px 24px rgba(64,35,39,.2);background:var(--sand)}
.opt{display:flex;align-items:center;min-height:52px;padding:12px 14px;border-radius:14px;font-size:15px;text-align:left;width:100%;line-height:1.35;border:1px solid #D9C7B3;background:var(--card)}
.opt b{margin-right:8px;opacity:.7}
.opt.correct{border-color:var(--green);background:var(--green-bg);color:#2F5A33;font-weight:600}
.opt.wrong{border-color:#C98484;background:var(--red-bg);color:var(--red)}
.opt.muted{border-color:var(--line);color:#A0857A}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;min-height:56px;border-radius:14px;border:1px solid #D9C7B3;background:var(--card);text-align:left;width:100%}
.mode.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.mode small{font-size:12px;opacity:.8}.mode b{font-size:15px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{font-size:14px;line-height:1.45;padding:12px 14px;border-radius:12px;background:var(--sand)}
.layout{display:grid;gap:8px;width:100%}
.pos{position:relative;aspect-ratio:1/1.6;border:1.5px dashed #C9B49C;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;overflow:hidden;color:var(--ink)}
.pos small{font-size:10px;line-height:1.15;color:var(--muted);padding:0 2px}
.pos .num{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:2}
.pos.live{border-style:solid;border-color:var(--line);padding:0;cursor:pointer}
.pos img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
img.rev{transform:rotate(180deg)}
.pos.on{outline:3px solid var(--caramel);outline-offset:1px}
.pos.cross{position:absolute;width:72%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);box-shadow:0 4px 12px rgba(64,35,39,.3);z-index:3}
.pos.cross small{display:none}
.wheel{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.wheel .pos{position:absolute;aspect-ratio:auto}
.wheel .pos small{display:none}
.wheel .pos .num{top:2px;left:2px;width:18px;height:18px;font-size:10px}
.step{display:flex;gap:10px;font-size:14px;line-height:1.45}.step b{width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid3 .tile{min-height:88px;padding:12px;gap:8px}.grid3 .tile b{font-size:14px}.grid3 .tile small{font-size:11px}
/* no quiz, a imagem é cortada em cima (numeral) e embaixo (nome) para não entregar a resposta */
.crop{width:150px;aspect-ratio:300/345;overflow:hidden;border-radius:8px;align-self:center;position:relative;background:var(--sand);box-shadow:0 8px 20px rgba(64,35,39,.18)}
.crop img{position:absolute;left:0;width:100%;height:calc(100% / .69);top:-21.74%;object-fit:cover}
.qa{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:none}
.qa .mk{width:22px;height:22px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.qa .mk.ok{background:var(--green-bg);color:#2F5A33;border:1px solid var(--green)}
.qa .mk.no{background:var(--red-bg);color:var(--red);border:1px solid #C98484}
.qa .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink2);font-weight:500}
.field input,.field textarea{width:100%;min-height:50px;padding:12px 14px;border:1px solid #D9C7B3;border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus{outline:2px solid var(--caramel);outline-offset:1px}
.field input.code{font-size:26px;letter-spacing:.35em;text-align:center;font-weight:600}
.err{font-size:14px;color:var(--red);background:var(--red-bg);border-radius:12px;padding:10px 12px}
.avatar{width:96px;height:96px;border-radius:99px;object-fit:cover;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--caramel);font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;overflow:hidden;flex-shrink:0}
.avatar.sm{width:44px;height:44px;font-size:20px;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.post.fix{border-color:var(--caramel);box-shadow:0 0 0 1px var(--caramel) inset}
.post .hd{display:flex;align-items:center;gap:10px}
.post .hd .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.post .hd .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .hd .who small{font-size:12px;color:var(--muted)}
.post .tx{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pf{width:100%;max-height:420px;object-fit:cover;border-radius:12px;background:var(--sand)}
.post .acts{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.post .acts button{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:none;border-radius:99px;background:transparent;color:var(--wood);font-size:14px;font-weight:500}
.post .acts button.on{color:#AD4A6A}
.post .acts button.on svg{fill:currentColor}
.tchip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--sand);color:var(--wood);font-size:11px;font-weight:600}
.fixtag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:11px;font-weight:600}
.pmenu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pmenu button{min-height:44px;border:none;border-bottom:1px solid var(--line);background:var(--paper);text-align:left;padding:0 14px;font-size:14px;color:var(--ink)}
.pmenu button:last-child{border-bottom:none}.pmenu button.danger{color:var(--red)}
.cmts{display:flex;flex-direction:column;gap:10px;background:var(--paper);border-radius:12px;padding:10px}
.cmt{display:flex;gap:8px}.cmt .bd{flex:1;min-width:0;font-size:14px;line-height:1.45}
.cmt .bd b{font-size:13px}.cmt .bd small{color:var(--muted);font-size:11px;margin-left:6px}
.cmt .bd p{margin:2px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.avatar.xs{width:30px;height:30px;font-size:14px;border:1px solid var(--line)}
.cform{display:flex;gap:8px}.cform input{flex:1;min-width:0;min-height:44px;padding:10px 12px;border:1px solid #D9C7B3;border-radius:12px;background:var(--card);font-family:inherit;font-size:16px;color:var(--ink)}
.cform button{min-height:44px;padding:0 14px;border:none;border-radius:12px;background:var(--wood);color:var(--paper);font-weight:600;font-size:14px}
.avatar.lg{width:96px;height:96px;font-size:40px;border:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pgrid button{aspect-ratio:1;border:none;padding:0;background:var(--sand);border-radius:6px;overflow:hidden}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.who button,.cmt button.nm{border:none;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.avbtn{border:none;background:transparent;padding:0;cursor:pointer;display:flex}
.selo{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--ink);color:var(--pink);font-size:11px;font-weight:600}
.selo.xs{padding:1px 7px;font-size:10px;margin-left:6px;vertical-align:middle}
.gfacil{background:#402327;color:#ECDF90}
.irmas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.irmas button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:12px;line-height:1.2;text-align:center}
.irmas img{width:56px;height:92px;object-fit:cover;border-radius:6px;background:var(--sand)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.cgrid>div,.cgrid>p{min-width:0}
.ccol{display:flex;flex-direction:column;gap:8px;padding:12px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.ccol img{width:96px;height:158px;object-fit:cover;border-radius:8px;background:var(--sand);box-shadow:0 8px 20px rgba(64,35,39,.18)}
.trilha{position:relative;display:flex;flex-direction:column;gap:8px}
.trilha::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line);z-index:0}
.cap{position:relative;z-index:1;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.cap.on{border-color:var(--caramel);box-shadow:0 0 0 1px var(--caramel) inset}
.cap.off{opacity:.78}
.caph{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 10px;border:none;background:transparent;text-align:left;min-height:64px}
.cap .no{width:24px;height:24px;border-radius:99px;border:2px solid var(--caramel);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--wood);background:var(--card);flex-shrink:0}
.cap.ok .no{background:var(--green);border-color:var(--green);color:#fff}
.cap.off .no{border-color:var(--line);color:var(--muted)}
.cap .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cap .t b{font-size:15px}.cap .t small{font-size:12px;color:var(--muted);line-height:1.3}
.capx{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px 46px}
.big{font-size:56px;line-height:1;color:var(--butter)}.big span{font-size:22px;color:var(--paper);opacity:.8}

.meta{display:flex;align-items:center;gap:10px;min-height:44px;padding:2px 0;border:none;background:transparent;text-align:left;width:100%}
.meta .mk{width:24px;height:24px;border-radius:99px;border:1.5px solid var(--caramel);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:var(--green)}
.meta.ok .mk{background:var(--green-bg);border-color:var(--green)}
.meta .t{display:flex;flex-direction:column;gap:1px;min-width:0}.meta b{font-size:14px}.meta small{font-size:12px;color:var(--muted)}
.meta.ok b{color:var(--muted)}
.conq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conq>div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:center;font-size:11px;line-height:1.25;color:var(--muted)}
.conq>div.on{border-color:var(--caramel);background:var(--ink);color:var(--paper)}
.conq .ic{font-size:24px;line-height:1.2;filter:grayscale(1);opacity:.45}.conq .on .ic{filter:none;opacity:1}
.conq b{font-size:12px;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(440px,calc(100% - 32px));background:#0E090A;color:#F4ECE1;border:1px solid var(--caramel);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:toastin .35s ease-out}
.toast .ic{font-size:26px;line-height:1}.toast b{display:block;font-size:14px;color:var(--butter)}.toast small{font-size:12px;opacity:.9;line-height:1.35}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.confete{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;z-index:19;pointer-events:none;animation:cair 1.8s ease-in forwards}
@keyframes cair{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
/* modo escuro automático (segue o aparelho) */
@media (prefers-color-scheme: dark){

function mergeNote(a,b){ a=a||''; b=b||''; if(!a.trim()) return b; if(!b.trim()||a===b) return a; if(a.includes(b)) return a; if(b.includes(a)) return b; return b+'\n\n— outra versão —\n'+a; }

function mergeData(d){

  if(d.stats) S.stats={quizzes:Math.max(S.stats.quizzes||0,d.stats.quizzes||0),best:Math.max(S.stats.best||0,d.stats.best||0)};
  if(Array.isArray(d.readings)){ const ids=new Set(S.readings.map(r=>r.id)); d.readings.forEach(r=>{ if(r&&r.id&&!ids.has(r.id)&&r.draw) S.readings.push(r); else if(r&&r.id&&Array.isArray(r.chat)){ const m=S.readings.find(x=>x.id===r.id); if(m&&(!Array.isArray(m.chat)||m.chat.length<r.chat.length)) m.chat=r.chat; } }); S.readings.sort((a,b)=>b.at-a.at); S.readings=S.readings.slice(0,100); }
  if(d.srs&&typeof d.srs==='object'){ const m=Object.assign({},S.srs); Object.keys(d.srs).forEach(k=>{ const a=m[k], b=d.srs[k]; if(!b||typeof b!=='object') return; if(!a||(b.reps||0)>(a.reps||0)||((b.reps||0)===(a.reps||0)&&(b.due||0)>(a.due||0))) m[k]=b; }); S.srs=m; }
  if(d.srsHoje&&d.srsHoje.d===hojeStr()&&(d.srsHoje.n||0)>(S.srsHoje.n||0)) S.srsHoje=d.srsHoje;

  if(Array.isArray(d.quizHistory)){ const qids=new Set(S.quizHistory.map(h=>h.id)); d.quizHistory.forEach(h=>{ if(h&&h.id&&!qids.has(h.id)&&Array.isArray(h.answers)) S.quizHistory.push(h); }); S.quizHistory.sort((a,b)=>b.at-a.at); S.quizHistory=S.quizHistory.slice(0,50); }

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
// Troca menções ao nome da carta por "esta carta", para quiz e flashcards não entregarem a resposta.
function mask(text, c){
  let t=String(text||'');
  const full=c.name, bare=full.replace(/^(O|A|Os|As)\s+/,'');
  const core=bare.split(/\s+(?:de|da|do|dos|das)\s+/)[0];
  const names=[full,bare]; if(core!==bare) names.push(core);
  const alts=names.map(rxEsc).sort((a,b)=>b.length-a.length).join('|');
  const det='(?:(?:o|a|os|as|um|uma|esse|essa|este|esta|aquele|aquela|nosso|nossa)\\s+)?';
  const rx=new RegExp('(^|[^\\p{L}])'+det+'(?:'+alts+')(?![\\p{L}])','giu');
  t=t.replace(rx,(m,pre)=>pre+(m.trim()[0]===m.trim()[0].toUpperCase()&&/^[A-ZÀ-Ú]/.test(m.trim())?'Esta carta':'esta carta'));
  if(c.suit==='maiores'){
    t=t.replace(/\b(?:a\s+)?carta\s+(?:de\s+)?n[úu]mero\s+\S+/giu,'esta carta');
    t=t.replace(new RegExp('\\b(?:o\\s+)?arcano\\s+(?:'+ROMAN[c.id]+'|'+c.id+'|zero)(?![\\p{L}\\d])','giu'),'esta carta');
  }
  t=t.replace(/esta carta,?\s+(?:a|esta)\s+carta/giu,'esta carta').replace(/\s{2,}/g,' ').replace(/^esta carta/,'Esta carta');
  return t;
}

function diasSeguidos(){
  const dias=diasEstudados(); let n=0; const d=new Date();
  if(!dias.has(diaDe(d))) d.setDate(d.getDate()-1);
  while(dias.has(diaDe(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function metasHoje(){

  const cartas=S.cartasDia.d===h?S.cartasDia.n:0, cdd=S.cdd.d===h&&S.cdd.ok;
  return [
    {id:'cdd',label:'Carta do dia',det:cdd?'feita':'responda uma pergunta ou escreva uma reflexão',ok:cdd,screen:'home'},
    {id:'flash',label:'Flashcards',det:flashHoje?'sessão feita':r.due?r.due+' para revisar':r.novasSessao?r.novasSessao+' novas disponíveis':'em dia',ok:flashHoje||(r.due===0&&r.novasSessao===0),screen:'flash'},

    {id:'quiz',label:'Um quiz',det:quizHoje?'feito':'10 perguntas',ok:quizHoje,screen:'quiz'}
  ];
}
function hojeHtml(){
  const m=metasHoje(), feitas=m.filter(x=>x.ok).length, seq=diasSeguidos(), fechado=feitas===m.length;
  const rows=m.map(x=>`<button class="meta${x.ok?' ok':''}" data-act="go" data-screen="${x.screen}"><span class="mk">${x.ok?'✓':''}</span><div class="t"><b>${x.label}</b><small>${esc(x.det)}</small></div></button>`).join('');
  return `<div class="box" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="h" style="color:var(--wood)">Hoje</div><div style="font-size:13px;color:var(--muted)"><b class="serif" style="font-size:24px;color:var(--ink)">${seq}</b> dia${seq===1?'':'s'} seguido${seq===1?'':'s'}</div></div>${rows}<div style="font-size:12px;color:${fechado?'var(--green)':'var(--muted)'};padding-top:4px">${fechado?'Dia fechado. Amanhã tem carta nova.':feitas+' de '+m.length+'. Qualquer uma já conta o dia na sequência.'}</div></div>`;
}
async function carregarDestaque(){
  const D=S.com.destaque; if(D.tentado||!logada()||!COM||!COM.fixados) return; D.tentado=true;
  try{ const l=await COM.fixados(); D.post=l[0]||null; }catch(e){ D.post=null; }
  const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(S.screen==='home'&&!typing) render();
}
function destaqueHtml(){
  if(!logada()||!COM) return '';
  const D=S.com.destaque; if(!D.tentado) carregarDestaque();
  const p=D.post; if(!p) return '';

const QMODOS=[

// Opções erradas: no nível difícil, cartas do mesmo naipe ou do mesmo número (Três de Copas × Três de Paus)
function distratores(c,pool,n){
  const outras=pool.filter(x=>x.id!==c.id);
  if(S.quizNivel!=='dificil') return shuffle(outras).slice(0,n);
  const parecidas=shuffle(outras.filter(x=>x.suit===c.suit||(c.rank!=null&&x.rank===c.rank)));
  const resto=shuffle(outras.filter(x=>!parecidas.includes(x)));
  return parecidas.concat(resto).slice(0,n);
}
function buildQuiz(scope, forcadas, qtd){
  const pool=cardsOf(scope); qtd=qtd||10;
  let picked=forcadas||shuffle(pool).slice(0,qtd);
  while(!forcadas&&picked.length<qtd) picked=picked.concat(shuffle(pool).slice(0,qtd-picked.length)); // relâmpago em grupos pequenos repete cartas
  const kinds=shuffle(['chaves','imagem','invertido','luz','sombra','simbolo','amor','financeiro','nome','imagem']);
  return picked.map((c,i)=>{
    let kind=kinds[i%kinds.length];
    const group=shuffle([c].concat(distratores(c,pool,3)));
    const names=group.map(x=>({id:String(x.id),label:x.name}));
    const ans=String(c.id);
    if(kind==='simbolo'){ const cand=(c.simbolismo||[]).map(t=>mask(t,c)).filter(t=>t.length>20&&!/esta carta/i.test(t)); if(cand.length) return {card:c,kind:'Simbolismo',text:'Em que carta aparece: “'+shuffle(cand)[0]+'”?',options:names,answer:ans}; kind='luz'; }
    if(kind==='chaves') return {card:c,kind:'Palavras-chave',text:'Qual carta tem as palavras-chave: '+mask(c.palavras,c)+'?',options:names,answer:ans};
    if(kind==='imagem') return {card:c,kind:'Reconheça a carta',text:'Que carta é esta?',img:c.img,options:names,answer:ans};
    if(kind==='invertido'){ let t=mask(c.invertido,c).replace(/^Invertid[ao],?\s*/i,'').split('. ')[0].replace(/^esta carta/i,'esta carta'); t=t.charAt(0).toLowerCase()+t.slice(1); return {card:c,kind:'Carta invertida',text:'Invertida, '+t+'. Qual é a carta?',options:names,answer:ans}; }
    if(kind==='luz') return {card:c,kind:'Lado de luz',text:'Qual carta tem como lado de luz: “'+pick2(c.luz.map(t=>mask(t,c)))+'”?',options:names,answer:ans};
    if(kind==='sombra') return {card:c,kind:'Lado de sombra',text:'Qual carta tem como lado de sombra: “'+pick2(c.sombra.map(t=>mask(t,c)))+'”?',options:names,answer:ans};
    if(kind==='amor') return {card:c,kind:'No amor',text:'No amor, qual carta resume: “'+mask(resumo(c.amor),c)+'”?',options:names,answer:ans};
    if(kind==='financeiro') return {card:c,kind:'No financeiro',text:'No financeiro, qual carta resume: “'+mask(resumo(c.financeiro),c)+'”?',options:names,answer:ans};
    return {card:c,kind:'Significado',text:'Quais são as palavras-chave de '+c.name+'?',options:group.map(x=>({id:String(x.id),label:x.palavras})),answer:ans,nome:true};
  });
}
function perguntaLuzSombra(c){
  const lado=Math.random()<.5?'luz':'sombra', arr=(c[lado]&&c[lado].length)?c[lado]:c[lado==='luz'?'sombra':'luz'], real=arr===c.luz?'luz':'sombra';
  return {card:c,kind:'Luz ou sombra?',text:'Em '+c.name+', “'+shuffle(arr)[0]+'” é lado de luz ou lado de sombra?',options:[{id:'luz',label:'Lado de luz'},{id:'sombra',label:'Lado de sombra'}],answer:real,ls:true};
}
// Cartas erradas no quiz e nos flashcards, da mais errada para a menos
function cartasErradas(){
  const m={}; S.quizHistory.forEach(h=>h.answers.forEach(a=>{ if(!a.ok&&CARDS[a.c]) m[a.c]=(m[a.c]||0)+1; }));
  S.flashHistory.forEach(h=>h.respostas.forEach(r=>{ if(r.n==='errei'&&CARDS[r.c]) m[r.c]=(m[r.c]||0)+1; }));
  return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(Number);
}
function montarQuiz(){
  const modo=S.quizModo, scope=S.quizScope, base={i:0,chosen:null,score:0,done:false,answers:[],modo,scope};
  if(modo==='relampago') return Object.assign(base,{qs:buildQuiz(scope,null,40),fim:Date.now()+60000});
  if(modo==='erros'){ const ids=cartasErradas(); if(!ids.length) return null; const top=ids.slice(0,10); return Object.assign(base,{qs:buildQuiz('all',shuffle(top.map(id=>CARDS[id])).map(c=>c)),scope:'erros'}); }
  if(modo==='luzsombra') return Object.assign(base,{qs:shuffle(cardsOf(scope)).slice(0,10).map(perguntaLuzSombra)});
  return Object.assign(base,{qs:buildQuiz(scope)});
}
let qTimer=null;
function pararTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function garantirTimer(){
  const q=S.quiz; if(!q||q.modo!=='relampago'||q.done||qTimer) return;
  qTimer=setInterval(()=>{
    const q=S.quiz; if(!q||q.done||S.screen!=='quiz'||q.modo!=='relampago'){ pararTimer(); return; }
    const resta=Math.max(0,q.fim-Date.now()); const el=document.getElementById('qtimer'); if(el) el.textContent=Math.ceil(resta/1000)+' s'; const bar=document.getElementById('qbar'); if(bar) bar.style.width=Math.round(100*resta/60000)+'%';
    if(resta<=0){ finalizarQuiz(q); render(); }
  },250);
}
function finalizarQuiz(q){
  if(q.done) return; q.done=true; pararTimer();
  const total=q.modo==='relampago'?q.answers.length:q.qs.length;
  S.stats.quizzes++; if(q.modo==='classico'&&total>=10) S.stats.best=Math.max(S.stats.best||0,q.score);
  const hid=String(Date.now()); q.histId=hid;
  S.quizHistory=[{id:hid,at:Date.now(),scope:q.scope||S.quizScope,modo:q.modo||'classico',score:q.score,total,answers:q.answers||[]}].concat(S.quizHistory).slice(0,50);
  marcarDia(); if(q.scope==='dia') S.cdd={d:hojeStr(),ok:true};
  if(total>=10&&q.score===total) celebrar();
  persist();
}
function avancarQuiz(q){
  const n=q.i+1; q.chosen=null;
  if(q.modo==='relampago'&&n>=q.qs.length&&Date.now()<q.fim) q.qs=q.qs.concat(buildQuiz(q.scope,null,20)); // relâmpago não acaba antes do relógio
  if(n>=q.qs.length||(q.modo==='relampago'&&Date.now()>=q.fim)) finalizarQuiz(q); else q.i=n;
  render(); document.getElementById('main').scrollTop=0;
}

    else if(q.modo==='luzsombra') msg=q.score>=9?'Você distingue bem os dois lados. É o que dá profundidade na leitura.':q.score>=6?'Bom. As que confundiu são as que valem reler na ficha, luz e sombra lado a lado.':'Releia luz e sombra das cartas que confundiu. A sombra costuma ser a luz em excesso.';

    else msg=q.qs.length<10?(q.score===q.qs.length?'Carta do dia respondida. Amanhã tem outra.':'Abra a ficha da carta do dia e releia com calma. Amanhã tem outra.'):q.score>=9?'Domínio total desse grupo. Passe para o próximo.':q.score>=6?'Bom caminho. Revise as que errou nas fichas.':'Vale voltar às fichas e aos flashcards antes de repetir.';
    const h=S.quizHistory.find(x=>x.id===q.histId);
    body=`<div class="dark stack" style="text-align:center;padding:24px 20px"><div class="eyebrow" style="color:var(--pink)">${q.modo==='relampago'?'Relâmpago · 60 segundos':'Resultado'}</div><div class="serif big">${q.score}<span>${q.modo==='relampago'?' acerto'+(q.score===1?'':'s')+' em '+total:' / '+total}</span></div><div style="font-size:14px;opacity:.9">${msg}</div></div>
    ${h?`<button class="btn ghost" data-act="qhist" data-id="${h.id}">${S.quizOpen===h.id?'Esconder acertos e erros':'Ver acertos e erros'}</button>${S.quizOpen===h.id?quizDetail(h):''}`:''}
    <button class="btn" data-act="qstart">${q.modo==='relampago'?'De novo · 60 segundos':'Novo quiz'}</button><button class="btn ghost" data-act="qreset">Ver histórico e trocar o modo</button>`;
  }
  return `${tituloComAvatar('Quiz')}${body}`;
}

// ---------- tiragens ----------
const SPREADS = window.TAROT_SPREADS || [];
const spreadById = id => SPREADS.find(x=>x.id===id) || SPREADS[0];
const curVar = sp => sp.variantes ? (sp.variantes.find(v=>v.id===S.spreadVar[sp.id]) || sp.variantes[0]) : null;
const fmtDate = t => { const d=new Date(t); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}); };
function posStyle(sp,p){
  if(sp.layout==='wheel'){
    if(p.center) return 'left:50%;top:50%;width:19%;height:29%;transform:translate(-50%,-50%)';
    const a=(180+(p.n-1)*30)*Math.PI/180, x=50+42*Math.cos(a), y=50-42*Math.sin(a);
    return `left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;width:13%;height:20%;transform:translate(-50%,-50%)`;
  }
  return `grid-column:${p.col};grid-row:${p.row}`;
}
function posInner(p,draw){
  const d=draw&&draw[p.n-1];
  if(d){ const c=CARDS[d.cardId]; return `<img src="${c.img}" alt="${esc(c.name)}" class="${d.rev?'rev':''}"><span class="num">${p.n}</span>`; }
  return `<span class="num">${p.n}</span><small>${esc(p.label.split(' · ')[0].split(':')[0])}</small>`;
}
function renderLayout(sp,draw,open){
  const live=!!draw;
  const cells=sp.positions.filter(p=>!p.cross).map(p=>{
    const cross=sp.positions.find(q=>q.cross&&q.col===p.col&&q.row===p.row);
    const act=live?` data-act="popen" data-id="${p.n}"`:'';
    const crossHtml=cross?`<div class="pos${live?' live':''}${cross.n===open?' on':''} cross"${live?` data-act="popen" data-id="${cross.n}"`:''}>${posInner(cross,draw)}</div>`:'';
    return `<div class="pos${live?' live':''}${p.n===open?' on':''}"${act} style="${posStyle(sp,p)}">${posInner(p,draw)}${crossHtml}</div>`;
  }).join('');
  if(sp.layout==='wheel') return `<div class="wheel">${cells}</div>`;
  return `<div class="layout" style="grid-template-columns:repeat(${sp.grid.cols},1fr)">${cells}</div>`;
}
function peladanSum(sp,pr){
  if(sp.id!=='peladan') return '';
  const four=pr.draw.slice(0,4).map(d=>CARDS[d.cardId]);
  if(!four.every(c=>c.suit==='maiores')) return `<div style="font-size:12px;color:var(--muted);text-align:center">A síntese calculada só vale quando as quatro primeiras são Arcanos Maiores. Aqui a quinta foi sorteada.</div>`;
  let sum=four.reduce((a,c)=>a+c.id,0); const raw=sum;
  while(sum>22) sum=String(sum).split('').reduce((a,d)=>a+ +d,0);
  const card=CARDS[sum===22?0:sum];
  return `<div class="fb" style="text-align:center">Síntese calculada: ${four.map(c=>c.id).join(' + ')} = ${raw}${raw!==sum?' → '+sum:''} · <b>${esc(card.name)}</b>. Compare com a quinta carta sorteada.</div>`;
}
function spreads(){
  const rows=SPREADS.map(sp=>`<button class="mod" data-act="spread" data-id="${sp.id}"><div class="g serif" style="font-size:22px;color:var(--wood)">${sp.cards}</div><div class="t"><b style="font-size:16px">${esc(sp.name)}</b><div style="font-size:12px;color:var(--muted);line-height:1.35">${esc(sp.tagline)}</div></div><span style="color:var(--caramel)">${ICONS.right}</span></button>`).join('');
  return `<div class="stack" style="gap:4px">${tituloComAvatar('Tiragens')}<p style="color:var(--ink2)">Aqui tiragem não prevê nada. Ela coloca um padrão seu em posições para você enxergar de onde ele vem, como aparece e o que pede. A pergunta é sempre de quem está na mesa: você, no estudo, ou a consulente, no atendimento. Ninguém lê quem não está lá.</p></div><div class="stack">${rows}</div>${historicoPraticas()}`;
}
function historicoPraticas(){
  const R=S.readings; if(!R.length) return '';
  const mes=new Date(); const noMes=R.filter(r=>{const d=new Date(r.at);return d.getMonth()===mes.getMonth()&&d.getFullYear()===mes.getFullYear();}).length;
  const comTexto=R.filter(r=>(r.interpretacao||'').trim()||(r.sintese||'').trim()).length;
  const rows=R.map(r=>{const sp=spreadById(r.spreadId); if(!sp) return ''; const frase=(r.pergunta||'').trim()||(r.sintese||'').trim(); const v=r.var&&sp.variantes?(sp.variantes.find(x=>x.id===r.var)||{}).label:''; return `<button class="row" data-act="phist" data-id="${r.id}" style="min-height:64px"><div class="t"><div class="n" style="font-size:15px;justify-content:space-between"><span>${esc(sp.name)}${v?' · '+esc(v):''}</span><span style="font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap">${fmtDate(r.at)}</span></div>${frase?`<div style="font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(frase)}</div>`:''}<div class="s">${r.draw.map(d=>CARDS[d.cardId].name+(d.rev?' (inv.)':'')).join(' · ')}${(r.interpretacao||'').trim()?' · com interpretação':''}</div></div><span style="color:var(--caramel)">${ICONS.right}</span></button>`;}).join('');
  return `<div class="stack" style="gap:12px;margin-top:8px"><h2 style="font-size:24px">Minhas práticas</h2>
  <div class="dark" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;padding:14px"><div><div class="serif" style="font-size:28px;color:var(--butter)">${R.length}</div><div style="font-size:11px;opacity:.8">prática${R.length===1?'':'s'}</div></div><div><div class="serif" style="font-size:28px;color:var(--butter)">${noMes}</div><div style="font-size:11px;opacity:.8">neste mês</div></div><div><div class="serif" style="font-size:28px;color:var(--butter)">${comTexto}</div><div style="font-size:11px;opacity:.8">com escrita</div></div></div>
  <div class="eyebrow">Todas as tiragens · toque para reabrir</div>${rows}</div>`;

function spread(){

function learnView(sp){

function textoPratica(sp,pr){

function practiceView(sp){

  return `${pergunta}${renderLayout(sp,pr.draw,open)}<div style="font-size:12px;color:var(--muted);text-align:center">Toque numa posição para ler a carta nela.</div>${peladanSum(sp,pr)}${panel}<div class="stack" style="gap:6px">${legend}</div>${sintese}${mentoraHtml()}
  <div class="grid2"><button class="btn ghost" data-act="pdraw">Sortear de novo</button><button class="btn" data-act="psave" ${pr.saved?'disabled style="opacity:.6"':''}>${pr.saved?'Prática salva':'Salvar prática'}</button></div>${logada()&&COM?`<button class="btn ghost" data-act="pshare">Compartilhar na roda</button>`:''}${list}`;

// ---------- Ofélia, a coruja do Grimório (chat de dúvidas dentro da prática e da ficha) ----------
// Coruja-da-igreja em SVG: cara em coração, dois olhos, bico curto. Cores da marca, sem imagem externa.
const CORUJA='<svg viewBox="0 0 32 32" fill="none" stroke="var(--wood)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 29.5c-6.4 0-10.5-5-10.5-11.2 0-5.4 3.1-9.6 6.3-12.8L16 8l4.2-2.5c3.2 3.2 6.3 7.4 6.3 12.8C26.5 24.5 22.4 29.5 16 29.5z" fill="var(--card)"/><path d="M16 27c-4.3-1-7.3-4.8-7.3-9 0-3.8 2.6-6.9 4.1-8.6L16 11.6l3.2-2.2c1.5 1.7 4.1 4.8 4.1 8.6 0 4.2-3 8-7.3 9z"/><circle cx="12.4" cy="16.2" r="1.5" fill="var(--wood)"/><circle cx="19.6" cy="16.2" r="1.5" fill="var(--wood)"/><path d="M16 18.3v3.2"/></svg>';
function mentoraCtx(){
  if(S.screen==='spread'&&S.spreadTab==='praticar'&&S.practice&&S.practice.spreadId===S.spreadId){
    const pr=S.practice; if(!Array.isArray(pr.chat)) pr.chat=[];
    return {chave:'p'+pr.at,chat:pr.chat,titulo:'Perguntar à Ofélia',intro:'Ofélia é a coruja do Grimório. Ela conhece esta tiragem e as fichas do app, não prevê nada e não lê quem não está na mesa: ajuda você a enxergar o padrão no escuro.',
      sugestoes:['Por que essa carta caiu nessa posição?','Minha pergunta está bem formulada?','Como ler a carta invertida aqui?','Que padrão aparece entre as posições?'],

      sync(){ pr.chat.splice(0,Math.max(0,pr.chat.length-20)); if(pr.saved){ const r=S.readings.find(x=>x.at===pr.at&&x.spreadId===pr.spreadId); if(r) r.chat=pr.chat.slice(); } }};

      sugestoes:['Qual a diferença entre a luz e a sombra aqui?','Como esta carta aparece numa cena do dia a dia?','O que muda quando ela vem invertida?'],
      placeholder:'Ex.: como diferenciar '+c.name+' de uma carta parecida?',corpo:{cardId:c.id},sync(){ chat.splice(0,Math.max(0,chat.length-20)); }};
  }

}
function mentoraHtml(){
  const ctx=mentoraCtx(); if(!ctx) return '';
  const head=`<div class="mtit"><span>${CORUJA}</span><h2 style="font-size:22px">${esc(ctx.titulo)}</h2></div><p style="font-size:13px;color:var(--ink2)">${esc(ctx.intro)}</p>`;
  if(!logada()) return `<div class="notes mentora">${head}<p style="font-size:14px">Entre na sua conta para conversar com a Ofélia.</p></div>`;

  const bolhas=ctx.chat.map((t,i)=>`<div class="mb q">${esc(t.q)}</div><div class="mrow"><span class="mav">${CORUJA}</span><div class="mb a${env&&i===n-1&&!t.a?' esc':''}"${i===n-1?' id="mresp"':''}>${esc(t.a)}</div></div>`).join('');

  const erro=S.mentora.erro&&S.mentora.chave===ctx.chave?`<div class="err">${esc(S.mentora.erro)}</div>`:'';
  const rodape=n?n+' troca'+(n===1?'':'s')+(ctx.chave[0]==='p'?' nesta prática':' nesta carta')+', salvas com o resto do estudo.':'Até 30 perguntas por dia. Só você vê esta conversa.';
  return `<div class="notes mentora">${head}${bolhas?`<div class="mchat" id="mchat">${bolhas}</div>`:''}${sug}<label for="mq" style="font-size:13px;font-weight:600;color:var(--wood)">Minha dúvida</label><textarea id="mq" data-mq maxlength="500" placeholder="${esc(ctx.placeholder)}"${env?' disabled':''}>${esc(S.mentoraDraft||'')}</textarea><button class="btn" data-act="mperg"${env?' disabled style="opacity:.6"':''}>${env?'Ofélia está escrevendo…':'Perguntar à Ofélia'}</button><div style="font-size:12px;color:var(--muted)">${esc(rodape)}</div>${erro}</div>`;
}
function rolarChat(){ const el=document.getElementById('mchat'); if(el) el.scrollTop=el.scrollHeight; }
async function perguntarMentora(pergunta){
  pergunta=(pergunta||'').trim().slice(0,500); const ctx=mentoraCtx();
  if(!pergunta||!ctx||S.mentora.enviando||!logada()) return;
  const A=window.GA_AUTH; let token=null; try{ token=A.token?await A.token():null; }catch(e){}
  if(!token){ S.mentora={enviando:false,erro:navigator.onLine?'Entre de novo para falar com a Ofélia.':'Sem internet agora.',chave:ctx.chave}; render(); return; }
  const troca={q:pergunta,a:'',at:Date.now()}; ctx.chat.push(troca); S.mentoraDraft=''; S.mentora={enviando:true,erro:'',chave:ctx.chave}; render(); rolarChat();
  const corpo=Object.assign({pergunta,historico:ctx.chat.slice(0,-1).slice(-10).map(t=>({q:t.q,a:t.a}))},ctx.corpo);
  const falhou=msg=>{ const i=ctx.chat.indexOf(troca); if(i>=0) ctx.chat.splice(i,1); S.mentora.erro=msg; S.mentoraDraft=pergunta; };
  try{
    const res=await fetch('/.netlify/functions/ofelia',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(corpo)});
    if(!res.ok){
      let msg='A Ofélia não respondeu agora. Tente em instantes.';
      if(res.status===401) msg='Entre de novo para falar com a Ofélia.'; else if(res.status===429) msg='Você já usou as perguntas de hoje. Amanhã a Ofélia volta.'; else if(res.status===503) msg='A Ofélia ainda não foi ligada neste app.';
      falhou(msg); return;
    }
    const reader=res.body.getReader(), dec=new TextDecoder();
    while(true){ const {value,done}=await reader.read(); if(done) break; troca.a+=dec.decode(value,{stream:true}); const el=document.getElementById('mresp'); if(el){ el.classList.remove('esc'); el.textContent=troca.a; rolarChat(); } }
    troca.a=troca.a.trim();
    if(!troca.a){ falhou('A Ofélia não respondeu agora. Tente em instantes.'); return; }
    ctx.sync(); marcarDia(); ganhar('mentora1');
  }catch(e){ falhou(navigator.onLine?'A Ofélia não respondeu agora. Tente em instantes.':'Sem internet agora.'); }
  finally{ S.mentora.enviando=false; persist(); render(); rolarChat(); }
}

  const cab=`<div style="display:flex;gap:16px;align-items:center">${avatarDe(p,'lg')}<div class="stack" style="gap:6px;min-width:0;flex:1"><div class="serif" style="font-size:26px;line-height:1.05;overflow-wrap:anywhere">${esc(nome)}</div>${A.ehAdminUid(P.uid)?'<span class="selo" style="align-self:flex-start">Administradora · Grimório Arcano</span>':''}<div style="display:flex;gap:18px"><div><b style="font-size:18px">${P.contagens?P.contagens.posts:'–'}</b><div style="font-size:12px;color:var(--muted)">posts</div></div><div><b style="font-size:18px">${P.contagens?P.contagens.curtidas:'–'}</b><div style="font-size:12px;color:var(--muted)">curtidas</div></div></div></div></div>

  ${minha?`<button class="btn ghost" data-act="go" data-screen="editarPerfil">Editar perfil</button>`+conquistasHtml():''}`;
  const pills=`<div class="pills">${[['todos','Todos os posts'],['foto','Com foto']].map(([id,l])=>`<button class="pill${(P.soFoto?'foto':'todos')===id?' on':''}" data-act="pubtab" data-id="${id}">${l}</button>`).join('')}</div>`;
  let corpo='';
  if(P.carregando&&!P.posts.length) corpo='<p style="text-align:center;color:var(--muted)">Carregando…</p>';
  else if(P.erro&&!P.posts.length) corpo=`<div class="err">${esc(P.erro)}</div>`;
  else if(!P.posts.length) corpo=`<div class="box" style="text-align:center;gap:6px"><p style="font-size:14px;color:var(--ink2)">${P.soFoto?'Nenhum post com foto ainda.':minha?'Você ainda não postou na Comunidade.':'Nenhum post ainda.'}</p>${minha&&!P.soFoto?'<button class="btn" data-act="cnovo">Escrever meu primeiro post</button>':''}</div>`;
  else if(P.soFoto) corpo=`<div class="pgrid">${P.posts.map(x=>`<button data-act="pubabrir" data-id="${x.id}" aria-label="Abrir post"><img src="${esc(x.foto_url)}" alt="" loading="lazy"></button>`).join('')}</div>`;
  else corpo=`<div class="stack" style="gap:12px">${P.posts.map(postHtml).join('')}</div>`;
  const mais=P.posts.length&&!P.fim?`<button class="btn ghost" data-act="pubmais" ${P.carregando?'disabled style="opacity:.6"':''}>${P.carregando?'Carregando…':'Carregar mais'}</button>`:'';
  return `${topo}${cab}${pills}${corpo}${mais}`;
}

let lastKey=null;
function render(){
  const main=document.getElementById('main');
  const key=S.screen+(S.screen==='card'?':'+S.cardId:S.screen==='comparar'&&S.cmp?':'+S.cmp.a+':'+S.cmp.b:S.screen==='library'?':'+S.suit:S.screen==='spread'?':'+S.spreadId+':'+S.spreadTab:S.screen==='perfil'?':'+S.pub.uid+':'+(S.pub.soFoto?'f':'t'):'');
  const keep = key===lastKey ? main.scrollTop : 0;
  const foco=document.activeElement&&main.contains(document.activeElement)&&document.activeElement.id?{id:document.activeElement.id,ini:document.activeElement.selectionStart,fim:document.activeElement.selectionEnd}:null;
  const A=window.GA_AUTH, gated=A&&A.enabled&&A.estado!=='ok';
  document.getElementById('nav').style.display=gated?'none':'';
  if(gated){ main.innerHTML=gateView(); lastKey='gate'; return; }
  main.innerHTML = S.screen==='comunidade'?comunidadeView():S.screen==='escrever'?escreverView():S.screen==='perfil'?perfilPubView():S.screen==='editarPerfil'?editarPerfilView():S.screen==='home'?home():S.screen==='library'?library():S.screen==='card'?cardView():S.screen==='comparar'?compararView():S.screen==='flash'?flash():S.screen==='spreads'?spreads():S.screen==='spread'?spread():quiz();
  main.scrollTop=keep; lastKey=key;
  if(foco){ const el=document.getElementById(foco.id); if(el){ el.focus({preventScroll:true}); try{ if(foco.ini!=null) el.setSelectionRange(foco.ini,foco.fim); }catch(e){} } }
  const active = S.screen==='card'||S.screen==='comparar'?'library':S.screen==='spread'?'spreads':S.screen==='escrever'?'comunidade':S.screen;
  const tabs=[['home','Início'],['library','Cartas'],['flash','Flashcards'],['quiz','Quiz'],['spreads','Tiragens']].concat(logada()&&COM?[['comunidade','Comunidade']]:[]);
  const navEl=document.getElementById('nav'); navEl.style.setProperty('--tabs',tabs.length);
  navEl.innerHTML=tabs.map(([id,l])=>`<button class="${active===id?'on':''}" data-act="go" data-screen="${id}">${ICONS[id==='library'?'cards':id]}<span>${l}</span></button>`).join('');
}

  else if(a==='phist'){ const r=S.readings.find(x=>x.id===id); if(!r) return; set({screen:'spread',spreadId:r.spreadId,spreadTab:'praticar',practice:{spreadId:r.spreadId,draw:r.draw,at:r.at,var:r.var,saved:true,pergunta:r.pergunta||'',sintese:r.sintese||'',interpretacao:r.interpretacao||'',chat:Array.isArray(r.chat)?r.chat.slice():[]},practiceOpen:null}); document.getElementById('main').scrollTop=0; }
  else if(a==='pload'){ const r=S.readings.find(x=>x.id===id); if(r) set({practice:{spreadId:r.spreadId,draw:r.draw,at:r.at,var:r.var,saved:true,pergunta:r.pergunta||'',sintese:r.sintese||'',interpretacao:r.interpretacao||'',chat:Array.isArray(r.chat)?r.chat.slice():[]},practiceOpen:null}); document.getElementById('main').scrollTop=0; }
  else if(a==='pdel'){ if(!confirm('Apagar esta prática?')) return; const pr=S.practice; const r=S.readings.find(x=>x.id===id); if(pr&&r&&pr.saved&&pr.at===r.at) pr.saved=false; set({readings:S.readings.filter(x=>x.id!==id)}); }
  else if(a==='pshare'){ const pr=S.practice; if(!pr||!logada()||!COM) return; const sp=spreadById(pr.spreadId); S.rasc.tema='tiragem'; S.rasc.erro=''; const tp=textoPratica(sp,pr); if(!S.rasc.texto.includes(tp.trim())) S.rasc.texto=S.rasc.texto.trim()?S.rasc.texto.trim()+'\n\n'+tp:tp; set({screen:'escrever'}); document.getElementById('main').scrollTop=0; }
  else if(a==='cdesafio'){ const pid=+id; set({screen:'comunidade'}); comCarregar(true).then(()=>{ if(!S.com.posts.some(x=>x.id===pid)) return; comAbrirComentarios(pid); const el=document.getElementById('post-'+pid); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }); }
  else if(a==='qstart'){ pararTimer(); const q=montarQuiz(); if(!q) return; set({quiz:q,quizOpen:null}); document.getElementById('main').scrollTop=0; }
  else if(a==='qreset'){ const q=S.quiz; if(q&&!q.done&&q.answers.length&&q.modo==='relampago') finalizarQuiz(q); pararTimer(); set({quiz:null,quizOpen:null}); }
  else if(a==='qhist') set({quizOpen:S.quizOpen===id?null:id});
  else if(a==='qdel'){ if(!confirm('Apagar este quiz do histórico?')) return; if(S.quiz&&S.quiz.histId===id) S.quiz.histId=null; set({quizHistory:S.quizHistory.filter(h=>h.id!==id),quizOpen:null}); }
  else if(a==='pick'){ const q=S.quiz; if(!q||q.done||q.chosen!==null) return; q.chosen=String(id); const cq=q.qs[q.i], ok=q.chosen===String(cq.answer); if(ok)q.score++; const op=cq.options.find(o=>o.id===q.chosen), cert=cq.options.find(o=>o.id===String(cq.answer)); if(!q.answers) q.answers=[]; q.answers.push({c:cq.card.id,k:cq.kind,t:cq.text,img:!!cq.img,ch:q.chosen,ok,lab:op?op.label:'',ans:cert?cert.label:''}); render(); if(q.modo==='relampago'){ setTimeout(()=>{ if(S.quiz===q&&!q.done&&q.chosen!==null) avancarQuiz(q); },ok?500:1100); } else { const nb=document.querySelector('[data-act="qnext"]'); if(nb) nb.scrollIntoView({behavior:'smooth',block:'end'}); } }
  else if(a==='qnext'){ const q=S.quiz; if(q&&!q.done) avancarQuiz(q); }
});

render();
if(window.GA_AUTH && window.GA_AUTH.enabled){
  const A=window.GA_AUTH; let authKey='';
  const resetLocal=()=>{ S.studied={}; S.notes={}; S.stats={quizzes:0,best:0}; S.readings=[]; S.quizHistory=[]; S.practice=null; S.quiz=null; S.flash=null; S.srs={}; S.flashHistory=[]; S.srsHoje={d:'',n:0}; S.diasEstudo={}; S.conquistas={}; S.cdd={d:'',ok:false}; S.cartasDia={d:'',n:0}; };
  A.iniciar({
    getData: backupData,
    applyData:(d,uid)=>{
      let dono=null; try{ dono=localStorage.getItem('ga-dono'); }catch(e){}
      if(dono && dono!==uid) resetLocal();      // aparelho usado por outra conta: não mistura
      mergeData(d); lastSent=null;
      try{ localStorage.setItem('ga-dono',uid); }catch(e){}
      persist();
      const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if(!typing) render();
    },
    limparLocal:()=>{ resetLocal(); S.screen='home'; lastSent=null; try{ localStorage.removeItem('ga-dono'); }catch(e){} persist(); },
    onChange:()=>{
      const k=[A.estado,A.erro,A.ocupado,A.admin,A.adminUids&&A.adminUids.size,A.perfil&&JSON.stringify(A.perfil)].join('|');
      const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&A.estado==='ok';
      if(k!==authKey&&!typing){ authKey=k; render(); }
      const st=document.getElementById('sync-status'); if(st) st.textContent={ok:'Progresso salvo na nuvem',enviando:'Salvando na nuvem…',pendente:'Sem conexão: salvo neste aparelho, sobe para a nuvem quando a internet voltar'}[A.sync]||'';
    }
  });
}
if('serviceWorker' in navigator){
  // Quando um service worker novo assume o controle (deploy novo), recarrega uma vez para mostrar a versão atualizada
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(navigator.serviceWorker.controller && !reloading){ reloading=true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // verifica se há versão nova toda vez que o app volta para o primeiro plano
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
}
})();
</script>
