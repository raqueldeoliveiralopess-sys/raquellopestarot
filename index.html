<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimório Arcano</title>
<meta name="theme-color" content="#402327">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimório">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--paper:#F4ECE1;--card:#FFFDF9;--line:#E2D3C2;--ink:#402327;--ink2:#5E4038;--muted:#7A5A4E;--wood:#593122;--caramel:#AD7E62;--pink:#F4B1C8;--butter:#ECDF90;--sand:#EDE1D2;--green:#3F6E4A;--green-bg:#EAF2EA;--red:#7E2C2C;--red-bg:#FBEDED}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
#app{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;min-height:0;position:relative}
#topbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:rgba(244,236,225,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
button:active{opacity:.85}
main>*{flex-shrink:0}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 28px;display:flex;flex-direction:column;gap:18px}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));flex-shrink:0}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;padding:6px 0;border:none;background:transparent;color:#A0857A;font-size:10.5px;font-weight:500}
nav button.on{color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn{min-height:52px;border:none;border-radius:14px;background:var(--wood);color:var(--paper);font-size:16px;font-weight:600;width:100%}
.btn.ghost{background:var(--card);color:var(--wood);border:1px solid var(--line);min-height:48px;font-size:15px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;min-height:96px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;width:100%}
.tile b{font-size:16px;font-weight:600}.tile small{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%}
.row img{width:40px;height:66px;object-fit:cover;border-radius:6px;background:var(--sand);flex-shrink:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .n{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:99px;background:#5E8C61;display:inline-block}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills.wrap{flex-wrap:wrap;overflow:visible}
.pill{min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid #D9C7B3;background:var(--card);color:var(--wood);font-size:13px;font-weight:500;white-space:nowrap}
.pill.on{border-color:var(--ink);background:var(--ink);color:var(--butter);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--sand);overflow:hidden}.bar i{display:block;height:100%;background:var(--caramel);border-radius:99px}
.dark{background:var(--ink);color:var(--paper);border-radius:20px;padding:18px}
.dark .bar{background:rgba(244,236,225,.18)}
.mod{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:72px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;width:100%}
.mod .g{width:44px;height:44px;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--caramel);flex-shrink:0}
.mod .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chip{padding:6px 10px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:12px;font-weight:500}
.box{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.box.dark{border:none;background:var(--ink);color:var(--paper)}
.notes{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#FBF3E4;border:1px solid #E8D6B8}
.notes textarea{width:100%;min-height:140px;padding:12px;border:1px solid #E2D3C2;border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;resize:vertical}
.notes textarea:focus{outline:2px solid var(--caramel);outline-offset:1px}
.notes .st{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;min-height:20px}
.link{border:none;background:transparent;color:var(--wood);font-size:13px;font-weight:600;padding:8px 4px;min-height:44px}
.box .h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.li{font-size:13px;line-height:1.4;padding-left:10px;border-left:2px solid var(--butter)}
.dark .li{border-color:var(--pink)}
p{margin:0;font-size:15px;line-height:1.5}
.sym{display:flex;gap:10px;font-size:14px;line-height:1.45}.sym i{width:6px;height:6px;border-radius:99px;background:var(--caramel);margin-top:7px;flex-shrink:0}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--wood);display:flex;align-items:center;justify-content:center}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:420px;padding:20px;border:1px solid var(--line);border-radius:22px;background:var(--card);text-align:center;width:100%}
.flash.back{background:var(--ink);color:var(--paper)}
.flash img{width:170px;height:280px;object-fit:cover;border-radius:10px;box-shadow:0 10px 24px rgba(64,35,39,.2);background:var(--sand)}
.opt{display:flex;align-items:center;min-height:52px;padding:12px 14px;border-radius:14px;font-size:15px;text-align:left;width:100%;line-height:1.35;border:1px solid #D9C7B3;background:var(--card)}
.opt b{margin-right:8px;opacity:.7}
.opt.correct{border-color:var(--green);background:var(--green-bg);color:#2F5A33;font-weight:600}
.opt.wrong{border-color:#C98484;background:var(--red-bg);color:var(--red)}
.opt.muted{border-color:var(--line);color:#A0857A}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;min-height:56px;border-radius:14px;border:1px solid #D9C7B3;background:var(--card);text-align:left;width:100%}
.mode.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.mode small{font-size:12px;opacity:.8}.mode b{font-size:15px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{font-size:14px;line-height:1.45;padding:12px 14px;border-radius:12px;background:var(--sand)}
.layout{display:grid;gap:8px;width:100%}
.pos{position:relative;aspect-ratio:1/1.6;border:1.5px dashed #C9B49C;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;overflow:hidden;color:var(--ink)}
.pos small{font-size:10px;line-height:1.15;color:var(--muted);padding:0 2px}
.pos .num{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:2}
.pos.live{border-style:solid;border-color:var(--line);padding:0;cursor:pointer}
.pos img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
img.rev{transform:rotate(180deg)}
.pos.on{outline:3px solid var(--caramel);outline-offset:1px}
.pos.cross{position:absolute;width:72%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);box-shadow:0 4px 12px rgba(64,35,39,.3);z-index:3}
.pos.cross small{display:none}
.wheel{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.wheel .pos{position:absolute;aspect-ratio:auto}
.wheel .pos small{display:none}
.wheel .pos .num{top:2px;left:2px;width:18px;height:18px;font-size:10px}
.step{display:flex;gap:10px;font-size:14px;line-height:1.45}.step b{width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--butter);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid3 .tile{min-height:88px;padding:12px;gap:8px}.grid3 .tile b{font-size:14px}.grid3 .tile small{font-size:11px}
/* no quiz, a imagem é cortada em cima (numeral) e embaixo (nome) para não entregar a resposta */
.crop{width:150px;aspect-ratio:300/345;overflow:hidden;border-radius:8px;align-self:center;position:relative;background:var(--sand);box-shadow:0 8px 20px rgba(64,35,39,.18)}
.crop img{position:absolute;left:0;width:100%;height:calc(100% / .69);top:-21.74%;object-fit:cover}
.qa{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:none}
.qa .mk{width:22px;height:22px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.qa .mk.ok{background:var(--green-bg);color:#2F5A33;border:1px solid var(--green)}
.qa .mk.no{background:var(--red-bg);color:var(--red);border:1px solid #C98484}
.qa .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink2);font-weight:500}
.field input,.field textarea{width:100%;min-height:50px;padding:12px 14px;border:1px solid #D9C7B3;border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus{outline:2px solid var(--caramel);outline-offset:1px}
.field input.code{font-size:26px;letter-spacing:.35em;text-align:center;font-weight:600}
.err{font-size:14px;color:var(--red);background:var(--red-bg);border-radius:12px;padding:10px 12px}
.avatar{width:96px;height:96px;border-radius:99px;object-fit:cover;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--caramel);font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;overflow:hidden;flex-shrink:0}
.avatar.sm{width:44px;height:44px;font-size:20px;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%}
.big{font-size:56px;line-height:1;color:var(--butter)}.big span{font-size:22px;color:var(--paper);opacity:.8}
</style>
</head>
<body>
<div id="topbar" aria-hidden="true"></div><div id="app"><main id="main"></main><nav id="nav"></nav></div>
<script src="cards.js"></script>
<script src="tiragens.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
const CARDS = window.TAROT_CARDS || [];
const SUITS = [
  {id:'maiores',label:'Arcanos Maiores',short:'Maiores',element:''},
  {id:'paus',label:'Paus',short:'Paus',element:'Fogo'},
  {id:'ouros',label:'Ouros',short:'Ouros',element:'Terra'},
  {id:'espadas',label:'Espadas',short:'Espadas',element:'Ar'},
  {id:'copas',label:'Copas',short:'Copas',element:'Água'}];
const ELEMENT_SVG = {
  maiores:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5L20.8 17.5H3.2Z"/><path d="M3.2 8.5H20.8L12 23.5Z"/></svg>',
  paus:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L21 20.5H3Z"/></svg>',
  ouros:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 3.5H21L12 20.5Z"/><path d="M4.6 9.5H19.4"/></svg>',
  espadas:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5L21 20.5H3Z"/><path d="M4.6 14.5H19.4"/></svg>',
  copas:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.5H21L12 20.5Z"/></svg>'
};
const SCOPES = [{id:'all',label:'Todas as 78'}].concat(SUITS.map(s=>({id:s.id,label:s.short})));
const ICONS = {
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  cards:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="17" rx="2"/><path d="M9 7h10a2 2 0 0 1 2 2v12H11"/></svg>',
  flash:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  quiz:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>',
  spreads:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="13" rx="1.5"/><path d="M5.5 7.5L3 8.3l3.6 11 4.4-1.5"/><path d="M18.5 7.5l2.5.8-3.6 11-4.4-1.5"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};

let saved = {};
try { saved = JSON.parse(localStorage.getItem('tarot-estudo') || '{}'); } catch (e) { saved = {}; }
const S = Object.assign({screen:'home',suit:'maiores',cardId:0,studied:{},notes:{},flashScope:'maiores',flashMode:'carta',flash:null,quizScope:'maiores',quiz:null,stats:{quizzes:0,best:0},spreadId:null,spreadTab:'aprender',spreadVar:{},practice:null,practiceOpen:null,practiceRev:true,readings:[],quizHistory:[],quizOpen:null}, saved.persist || {});
if(!S.readings) S.readings=[]; if(!Array.isArray(S.quizHistory)) S.quizHistory=[]; S.quizOpen=null; if(!S.spreadVar) S.spreadVar={};
if(!S.notes) S.notes={};
function persist(){ try { localStorage.setItem('tarot-estudo', JSON.stringify({persist:{studied:S.studied,notes:S.notes,flashScope:S.flashScope,flashMode:S.flashMode,quizScope:S.quizScope,stats:S.stats,suit:S.suit,spreadVar:S.spreadVar,practice:S.practice,practiceRev:S.practiceRev,readings:S.readings,quizHistory:S.quizHistory}})); syncLater(); return true; } catch(e){ return false; } }
let lastSent=null;
function syncLater(){ const A=window.GA_AUTH; if(!A||!A.enabled||A.estado!=='ok') return; const str=JSON.stringify(backupData()); if(str===lastSent) return; lastSent=str; A.agendarEnvio(); }
function exportBackup(){
  const data={app:'estudo-tarot',exportadoEm:new Date().toISOString(),studied:S.studied,notes:S.notes,stats:S.stats,readings:S.readings,quizHistory:S.quizHistory};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='estudo-tarot-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
}
function backupData(){ return {studied:S.studied,notes:S.notes,stats:S.stats,readings:S.readings,quizHistory:S.quizHistory}; }
function mergeNote(a,b){ a=a||''; b=b||''; if(!a.trim()) return b; if(!b.trim()||a===b) return a; if(a.includes(b)) return a; if(b.includes(a)) return b; return b+'\n\n— outra versão —\n'+a; }
// Junta dados de outro lugar (backup ou nuvem) com os do aparelho, sem perder nada.
function mergeData(d){
  if(!d) return;
  const st=Object.assign({},S.studied); Object.keys(d.studied||{}).forEach(k=>{ if(d.studied[k]) st[k]=true; }); S.studied=st;
  const nt=Object.assign({},S.notes); Object.keys(d.notes||{}).forEach(k=>{ nt[k]=mergeNote(nt[k],d.notes[k]); }); S.notes=nt;
  if(d.stats) S.stats={quizzes:Math.max(S.stats.quizzes||0,d.stats.quizzes||0),best:Math.max(S.stats.best||0,d.stats.best||0)};
  if(Array.isArray(d.readings)){ const ids=new Set(S.readings.map(r=>r.id)); d.readings.forEach(r=>{ if(r&&r.id&&!ids.has(r.id)&&r.draw) S.readings.push(r); }); S.readings.sort((a,b)=>b.at-a.at); S.readings=S.readings.slice(0,30); }
  if(Array.isArray(d.quizHistory)){ const qids=new Set(S.quizHistory.map(h=>h.id)); d.quizHistory.forEach(h=>{ if(h&&h.id&&!qids.has(h.id)&&Array.isArray(h.answers)) S.quizHistory.push(h); }); S.quizHistory.sort((a,b)=>b.at-a.at); S.quizHistory=S.quizHistory.slice(0,50); }
}
function importBackup(file){
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=='estudo-tarot') throw 0; mergeData(d); persist(); render(); }catch(e){ alert('Esse arquivo não é um backup do app.'); } }; r.readAsText(file);
}
function set(patch){ Object.assign(S,patch); persist(); render(); }

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cardsOf = sc => sc==='all'?CARDS:CARDS.filter(c=>c.suit===sc);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const resumo = t => { const m=/Resumo:\s*(.*)$/i.exec(t||''); return m?m[1].trim():(t||'').split('. ')[0]; };
const ROMAN={0:'0',1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX',10:'X',11:'XI',12:'XII',13:'XIII',14:'XIV',15:'XV',16:'XVI',17:'XVII',18:'XVIII',19:'XIX',20:'XX',21:'XXI'};
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
// Troca menções ao nome da carta por "esta carta", para quiz e flashcards não entregarem a resposta.
function mask(text, c){
  let t=String(text||'');
  const full=c.name, bare=full.replace(/^(O|A|Os|As)\s+/,'');
  const core=bare.split(/\s+(?:de|da|do|dos|das)\s+/)[0];
  const names=[full,bare]; if(core!==bare) names.push(core);
  const alts=names.map(rxEsc).sort((a,b)=>b.length-a.length).join('|');
  const det='(?:(?:o|a|os|as|um|uma|esse|essa|este|esta|aquele|aquela|nosso|nossa)\\s+)?';
  const rx=new RegExp('(^|[^\\p{L}])'+det+'(?:'+alts+')(?![\\p{L}])','giu');
  t=t.replace(rx,(m,pre)=>pre+(m.trim()[0]===m.trim()[0].toUpperCase()&&/^[A-ZÀ-Ú]/.test(m.trim())?'Esta carta':'esta carta'));
  if(c.suit==='maiores'){
    t=t.replace(/\b(?:a\s+)?carta\s+(?:de\s+)?n[úu]mero\s+\S+/giu,'esta carta');
    t=t.replace(new RegExp('\\b(?:o\\s+)?arcano\\s+(?:'+ROMAN[c.id]+'|'+c.id+'|zero)(?![\\p{L}\\d])','giu'),'esta carta');
  }
  t=t.replace(/esta carta,?\s+(?:a|esta)\s+carta/giu,'esta carta').replace(/\s{2,}/g,' ').replace(/^esta carta/,'Esta carta');
  return t;
}
const pick2 = a => shuffle(a||[]).slice(0,2).join('; ');
const studiedCount = () => Object.keys(S.studied).filter(k=>S.studied[k]).length;

function buildQuiz(scope){
  const pool=cardsOf(scope), picked=shuffle(pool).slice(0,10);
  const kinds=shuffle(['chaves','imagem','invertido','luz','sombra','simbolo','amor','financeiro','nome','imagem']);
  return picked.map((c,i)=>{
    let kind=kinds[i%kinds.length];
    const group=shuffle([c].concat(shuffle(pool.filter(x=>x.id!==c.id)).slice(0,3)));
    const names=group.map(x=>({id:x.id,label:x.name}));
    if(kind==='simbolo'){ const cand=(c.simbolismo||[]).map(t=>mask(t,c)).filter(t=>t.length>20&&!/esta carta/i.test(t)); if(cand.length) return {card:c,kind:'Simbolismo',text:'Em que carta aparece: “'+shuffle(cand)[0]+'”?',options:names,answer:c.id}; kind='luz'; }
    if(kind==='chaves') return {card:c,kind:'Palavras-chave',text:'Qual carta tem as palavras-chave: '+mask(c.palavras,c)+'?',options:names,answer:c.id};
    if(kind==='imagem') return {card:c,kind:'Reconheça a carta',text:'Que carta é esta?',img:c.img,options:names,answer:c.id};
    if(kind==='invertido'){ let t=mask(c.invertido,c).replace(/^Invertid[ao],?\s*/i,'').split('. ')[0].replace(/^esta carta/i,'esta carta'); t=t.charAt(0).toLowerCase()+t.slice(1); return {card:c,kind:'Carta invertida',text:'Invertida, '+t+'. Qual é a carta?',options:names,answer:c.id}; }
    if(kind==='luz') return {card:c,kind:'Lado de luz',text:'Qual carta tem como lado de luz: “'+pick2(c.luz.map(t=>mask(t,c)))+'”?',options:names,answer:c.id};
    if(kind==='sombra') return {card:c,kind:'Lado de sombra',text:'Qual carta tem como lado de sombra: “'+pick2(c.sombra.map(t=>mask(t,c)))+'”?',options:names,answer:c.id};
    if(kind==='amor') return {card:c,kind:'No amor',text:'No amor, qual carta resume: “'+mask(resumo(c.amor),c)+'”?',options:names,answer:c.id};
    if(kind==='financeiro') return {card:c,kind:'No financeiro',text:'No financeiro, qual carta resume: “'+mask(resumo(c.financeiro),c)+'”?',options:names,answer:c.id};
    return {card:c,kind:'Significado',text:'Quais são as palavras-chave de '+c.name+'?',options:group.map(x=>({id:x.id,label:x.palavras})),answer:c.id};
  });
}

function posInner(p,draw){
  const d=draw&&draw[p.n-1];
  if(d){ const c=CARDS[d.cardId]; return `<img src="${c.img}" alt="${esc(c.name)}" class="${d.rev?'rev':''}"><span class="num">${p.n}</span>`; }
  return `<span class="num">${p.n}</span><small>${esc(p.label.split(' · ')[0].split(':')[0])}</small>`;
}
function renderLayout(sp,draw,open){
  const live=!!draw;
  const cells=sp.positions.filter(p=>!p.cross).map(p=>{
    const cross=sp.positions.find(q=>q.cross&&q.col===p.col&&q.row===p.row);
    const act=live?` data-act="popen" data-id="${p.n}"`:'';
    const crossHtml=cross?`<div class="pos${live?' live':''}${cross.n===open?' on':''} cross"${live?` data-act="popen" data-id="${cross.n}"`:''}>${posInner(cross,draw)}</div>`:'';
    return `<div class="pos${live?' live':''}${p.n===open?' on':''}"${act} style="${posStyle(sp,p)}">${posInner(p,draw)}${crossHtml}</div>`;
  }).join('');
  if(sp.layout==='wheel') return `<div class="wheel">${cells}</div>`;
  return `<div class="layout" style="grid-template-columns:repeat(${sp.grid.cols},1fr)">${cells}</div>`;
}
function peladanSum(sp,pr){
  if(sp.id!=='peladan') return '';
  const four=pr.draw.slice(0,4).map(d=>CARDS[d.cardId]);
  if(!four.every(c=>c.suit==='maiores')) return `<div style="font-size:12px;color:var(--muted);text-align:center">A síntese calculada só vale quando as quatro primeiras são Arcanos Maiores. Aqui a quinta foi sorteada.</div>`;
  let sum=four.reduce((a,c)=>a+c.id,0); const raw=sum;
  while(sum>22) sum=String(sum).split('').reduce((a,d)=>a+ +d,0);
  const card=CARDS[sum===22?0:sum];
  return `<div class="fb" style="text-align:center">Síntese calculada: ${four.map(c=>c.id).join(' + ')} = ${raw}${raw!==sum?' → '+sum:''} · <b>${esc(card.name)}</b>. Compare com a quinta carta sorteada.</div>`;
}
function spreads(){
  const rows=SPREADS.map(sp=>`<button class="mod" data-act="spread" data-id="${sp.id}"><div class="g serif" style="font-size:22px;color:var(--wood)">${sp.cards}</div><div class="t"><b style="font-size:16px">${esc(sp.name)}</b><div style="font-size:12px;color:var(--muted);line-height:1.35">${esc(sp.tagline)}</div></div><span style="color:var(--caramel)">${ICONS.right}</span></button>`).join('');
  return `<div class="stack" style="gap:4px"><h1 style="font-size:32px">Tiragens</h1><p style="color:var(--ink2)">Aqui tiragem não prevê nada. Ela coloca um padrão seu em posições para você enxergar de onde ele vem, como aparece e o que pede. Toda pergunta é sobre você, nunca sobre o outro.</p></div><div class="stack">${rows}</div>${S.readings.length?`<div style="font-size:11px;color:#7A5A4E;text-align:center">${S.readings.length} prática${S.readings.length===1?'':'s'} salva${S.readings.length===1?'':'s'} neste aparelho</div>`:''}`;
}
function spread(){
  const sp=spreadById(S.spreadId), tab=S.spreadTab;
  const head=`<div style="display:flex;justify-content:space-between;align-items:center;margin:-8px -8px 0"><button data-act="go" data-screen="spreads" style="display:flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border:none;background:transparent;color:var(--wood);font-size:15px">${ICONS.left}Tiragens</button></div>
  <div class="stack" style="gap:4px"><div class="eyebrow">${sp.cards} cartas</div><h1 style="font-size:32px;line-height:1.05">${esc(sp.name)}</h1><p style="color:var(--ink2);font-size:14px">${esc(sp.tagline)}</p></div>
  <div class="pills">${[['aprender','Aprender'],['praticar','Praticar']].map(([id,l])=>`<button class="pill${tab===id?' on':''}" data-act="stab" data-id="${id}">${l}</button>`).join('')}</div>`;
  return head+(tab==='praticar'?practiceView(sp):learnView(sp));
}
function varPills(sp){
  if(!sp.variantes) return '';
  const cur=curVar(sp);
  return `<div class="stack" style="gap:8px"><div class="eyebrow">Horizonte</div><div class="pills">${sp.variantes.map(v=>`<button class="pill${cur.id===v.id?' on':''}" data-act="svar" data-id="${v.id}">${v.label}</button>`).join('')}</div><p style="font-size:14px">${esc(cur.texto)}</p></div>`;
}
function learnView(sp){
  const pos=sp.positions.slice().sort((a,b)=>a.n-b.n).map(p=>`<div class="box" style="gap:6px"><div style="display:flex;gap:10px;align-items:baseline"><b class="serif" style="font-size:24px;color:var(--caramel);line-height:1">${p.n}</b><b style="font-size:15px">${esc(p.label)}</b></div><p style="font-size:14px">${esc(p.sentido)}</p><span class="chip" style="align-self:flex-start;white-space:normal;line-height:1.3">${esc(p.jung)}</span>${p.perguntas.map(q=>`<div class="li">${esc(q)}</div>`).join('')}</div>`).join('');
  return `<p>${esc(sp.intro)}</p><div class="box" style="background:var(--sand);border:none;gap:6px"><div class="h" style="color:var(--wood)">Quando usar</div><p style="font-size:14px">${esc(sp.quando)}</p></div>${varPills(sp)}
  <div class="stack" style="gap:8px"><h2 style="font-size:22px">O desenho</h2>${renderLayout(sp,null,null)}<div style="font-size:12px;color:var(--muted);text-align:center">Em Praticar, o app sorteia cartas nessas posições.</div></div>
  <div class="stack" style="gap:8px"><h2 style="font-size:22px">As posições</h2>${pos}</div>
  <div class="stack" style="gap:10px"><h2 style="font-size:22px">Como ler</h2>${sp.metodo.map((m,i)=>`<div class="step"><b>${i+1}</b><div>${esc(m)}</div></div>`).join('')}</div>
  <div class="box dark" style="gap:8px"><div class="h" style="color:var(--pink)">Eixos que se leem juntos</div>${sp.relacoes.map(r=>`<div class="li">${esc(r)}</div>`).join('')}</div>
  ${sp.exemplo?`<div class="notes" style="gap:6px"><div class="h" style="color:var(--wood)">Exemplo de leitura</div><p style="font-size:14px">${esc(sp.exemplo)}</p></div>`:''}
  <button class="btn" data-act="stab" data-id="praticar">Praticar esta tiragem</button>`;
}
function practiceView(sp){
  const pr=S.practice&&S.practice.spreadId===sp.id?S.practice:null;
  const mine=S.readings.filter(r=>r.spreadId===sp.id);
  const list=mine.length?`<div class="stack" style="gap:8px"><h2 style="font-size:22px">Minhas práticas</h2>${mine.map(r=>`<div class="row" style="min-height:56px;gap:6px"><div class="t"><div class="n" style="font-size:14px">${fmtDate(r.at)}${r.var&&sp.variantes?` · ${esc((sp.variantes.find(v=>v.id===r.var)||{}).label||'')}`:''}</div><div class="s">${r.draw.map(d=>CARDS[d.cardId].name+(d.rev?' (inv.)':'')).join(' · ')}</div></div><button class="link" data-act="pload" data-id="${r.id}">Abrir</button><button class="link" data-act="pdel" data-id="${r.id}" style="color:var(--red)">Apagar</button></div>`).join('')}</div>`:'';
  if(!pr) return `<p style="color:var(--ink2)">Pense numa pergunta sobre você, respire, e sorteie. Depois toque em cada posição para ler a carta no lugar dela.</p>${varPills(sp)}
    <button class="mode${S.practiceRev?' on':''}" data-act="prevt"><b>${S.practiceRev?'Com cartas invertidas':'Sem cartas invertidas'}</b><small>Toque para alternar. Cerca de uma em quatro sai invertida.</small></button>
    <button class="btn" data-act="pdraw">Sortear ${sp.cards} cartas</button>${list}`;
  const open=S.practiceOpen, p=sp.positions.find(x=>x.n===open);
  let panel='';
  if(p){
    const d=pr.draw[p.n-1], c=CARDS[d.cardId];
    const area=sp.area==='amor'?c.amor:sp.area==='financeiro'?c.financeiro:c.geral;
    panel=`<div class="box" style="gap:10px;border-color:var(--caramel)"><div style="display:flex;gap:14px"><img src="${c.img}" alt="" class="${d.rev?'rev':''}" style="width:84px;height:138px;object-fit:cover;border-radius:8px;flex-shrink:0;box-shadow:0 6px 16px rgba(64,35,39,.18);background:var(--sand)"><div class="stack" style="gap:4px;min-width:0"><div class="eyebrow">${p.n} · ${esc(p.label)}</div><div class="serif" style="font-size:24px;line-height:1.05">${esc(c.name)}${d.rev?' <span style="font-size:14px;color:var(--red);font-family:Jost,sans-serif">invertida</span>':''}</div><div style="font-size:13px;color:var(--ink2)">${esc(c.palavras)}</div></div></div>
    <div style="font-size:13px;line-height:1.45;color:var(--ink2)"><b style="color:var(--wood)">A posição.</b> ${esc(p.sentido)}</div>
    <div style="font-size:14px;line-height:1.5"><b style="color:var(--wood)">${d.rev?'A carta invertida.':'A carta aqui.'}</b> ${esc(d.rev?c.invertido:area)}</div>
    <span class="chip" style="align-self:flex-start;white-space:normal;line-height:1.3">${esc(p.jung)}</span>
    ${p.perguntas.map(q=>`<div class="li">${esc(q)}</div>`).join('')}
    <button class="btn ghost" data-act="card" data-id="${c.id}">Abrir a ficha de ${esc(c.name)}</button></div>`;
  }
  const legend=sp.positions.slice().sort((a,b)=>a.n-b.n).map(x=>{const d=pr.draw[x.n-1],c=CARDS[d.cardId];return `<button class="row${open===x.n?' on':''}" style="min-height:48px;padding:6px 10px;${open===x.n?'border-color:var(--caramel)':''}" data-act="popen" data-id="${x.n}"><b class="serif" style="font-size:20px;color:var(--caramel);width:26px;text-align:center">${x.n}</b><div class="t"><div class="n" style="font-size:14px">${esc(c.name)}${d.rev?' <span style="font-size:11px;color:var(--red);font-weight:500">inv.</span>':''}</div><div class="s">${esc(x.label)}</div></div></button>`;}).join('');
  return `${renderLayout(sp,pr.draw,open)}<div style="font-size:12px;color:var(--muted);text-align:center">Toque numa posição para ler a carta nela.</div>${peladanSum(sp,pr)}${panel}<div class="stack" style="gap:6px">${legend}</div>
  <div class="grid2"><button class="btn ghost" data-act="pdraw">Sortear de novo</button><button class="btn" data-act="psave" ${pr.saved?'disabled style="opacity:.6"':''}>${pr.saved?'Prática salva':'Salvar prática'}</button></div>${list}`;
}

let lastKey=null;
function render(){
  const main=document.getElementById('main');
  const key=S.screen+(S.screen==='card'?':'+S.cardId:S.screen==='library'?':'+S.suit:S.screen==='spread'?':'+S.spreadId+':'+S.spreadTab:'');
  const keep = key===lastKey ? main.scrollTop : 0;
  const A=window.GA_AUTH, gated=A&&A.enabled&&A.estado!=='ok';
  document.getElementById('nav').style.display=gated?'none':'';
  if(gated){ main.innerHTML=gateView(); lastKey='gate'; return; }
  main.innerHTML = S.screen==='perfil'?perfilView():S.screen==='home'?home():S.screen==='library'?library():S.screen==='card'?cardView():S.screen==='flash'?flash():S.screen==='spreads'?spreads():S.screen==='spread'?spread():quiz();
  main.scrollTop=keep; lastKey=key;
  const active = S.screen==='card'?'library':S.screen==='spread'?'spreads':S.screen;
  document.getElementById('nav').innerHTML=[['home','Início'],['library','Cartas'],['flash','Flashcards'],['quiz','Quiz'],['spreads','Tiragens']].map(([id,l])=>`<button class="${active===id?'on':''}" data-act="go" data-screen="${id}">${ICONS[id==='library'?'cards':id]}<span>${l}</span></button>`).join('');
}

let noteTimer=null;
document.getElementById('app').addEventListener('input',e=>{
  const t=e.target; if(!t.matches('[data-note]')) return;
  const id=t.dataset.note; S.notes[id]=t.value;
  const st=document.getElementById('note-status'); if(st) st.textContent='Salvando…';
  clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ const ok=persist(); if(st) st.textContent=ok?'Salvo neste aparelho':'Não foi possível salvar'; },400);
});
document.getElementById('app').addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); const A=window.GA_AUTH;
  if(f.dataset.form==='email') A.enviarCodigo(document.getElementById('ga-email').value);
  else if(f.dataset.form==='codigo') A.validarCodigo(document.getElementById('ga-code').value);
});
document.getElementById('app').addEventListener('input',e=>{
  const t=e.target; if(!t.matches('[data-pf]')) return; S.pfDraft=S.pfDraft||{}; S.pfDraft[t.dataset.pf]=t.value; S.pfSaved=false;
});
document.getElementById('app').addEventListener('change',e=>{
  const t=e.target; if(t.matches('[data-import]') && t.files && t.files[0]) importBackup(t.files[0]);
  if(t.matches('[data-pf-foto]') && t.files && t.files[0]){ S.pfFile=t.files[0]; S.pfSaved=false; if(S.pfPreview) URL.revokeObjectURL(S.pfPreview); S.pfPreview=URL.createObjectURL(S.pfFile); render(); }
});
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  if(a==='export') exportBackup();
  else if(a==='ga-reenviar') window.GA_AUTH.enviarCodigo(window.GA_AUTH.email);
  else if(a==='ga-trocar') window.GA_AUTH.trocarEmail();
  else if(a==='ga-denovo') window.GA_AUTH.tentarDeNovo();
  else if(a==='ga-sair'){ if(window.GA_AUTH.estado!=='ok'||confirm('Sair da sua conta neste aparelho?')) window.GA_AUTH.sair(); }
  else if(a==='pf-salvar'){ const A=window.GA_AUTH, d=S.pfDraft||{}; A.salvarPerfil({nome:d.nome,bio:d.bio,foto:S.pfFile}).then(ok=>{ if(ok){ S.pfFile=null; if(S.pfPreview){URL.revokeObjectURL(S.pfPreview);S.pfPreview=null;} S.pfSaved=true; S.pfDraft=null; render(); } }); }
  else if(a==='go'&&b.dataset.screen==='perfil'){ S.pfDraft=null; S.pfSaved=false; set({screen:'perfil'}); }
  else if(a==='go') set({screen:b.dataset.screen});
  else if(a==='lib') set({screen:'library',suit:b.dataset.suit});
  else if(a==='suit') set({suit:b.dataset.suit});
  else if(a==='card') set({screen:'card',cardId:+id});
  else if(a==='prev') set({cardId:(S.cardId+CARDS.length-1)%CARDS.length});
  else if(a==='next') set({cardId:(S.cardId+1)%CARDS.length});
  else if(a==='toggle'){ const st=Object.assign({},S.studied); st[S.cardId]=!st[S.cardId]; set({studied:st}); }
  else if(a==='fscope') set({flashScope:id});
  else if(a==='fmode') set({flashMode:id});
  else if(a==='fstart') set({flash:{deck:shuffle(cardsOf(S.flashScope)).map(c=>c.id),i:0,flipped:false,known:0,unknown:0,done:false}});
  else if(a==='freset') set({flash:null});
  else if(a==='flip'){ S.flash.flipped=!S.flash.flipped; render(); }
  else if(a==='fyes'||a==='fno'){ const f=S.flash, n=f.i+1; if(a==='fyes')f.known++; else f.unknown++; f.flipped=false; if(n>=f.deck.length)f.done=true; else f.i=n; render(); document.getElementById('main').scrollTop=0; }
  else if(a==='qscope') set({quizScope:id});
  else if(a==='spread') set({screen:'spread',spreadId:id,spreadTab:'aprender',practiceOpen:null});
  else if(a==='stab'){ set({spreadTab:id,practiceOpen:null}); document.getElementById('main').scrollTop=0; }
  else if(a==='svar'){ const v=Object.assign({},S.spreadVar); v[S.spreadId]=id; set({spreadVar:v}); }
  else if(a==='prevt') set({practiceRev:!S.practiceRev});
  else if(a==='pdraw'){ const sp=spreadById(S.spreadId); const draw=shuffle(CARDS).slice(0,sp.cards).map(c=>({cardId:c.id,rev:S.practiceRev&&Math.random()<.25})); const v=curVar(sp); set({practice:{spreadId:sp.id,draw,at:Date.now(),var:v?v.id:null,saved:false},practiceOpen:null}); document.getElementById('main').scrollTop=0; }
  else if(a==='popen'){ set({practiceOpen:S.practiceOpen===+id?null:+id}); }
  else if(a==='psave'){ const pr=S.practice; if(!pr||pr.saved) return; const r={id:String(Date.now()),spreadId:pr.spreadId,draw:pr.draw,at:Date.now(),var:pr.var}; pr.saved=true; set({readings:[r].concat(S.readings).slice(0,30)}); }
  else if(a==='pload'){ const r=S.readings.find(x=>x.id===id); if(r) set({practice:{spreadId:r.spreadId,draw:r.draw,at:r.at,var:r.var,saved:true},practiceOpen:null}); document.getElementById('main').scrollTop=0; }
  else if(a==='pdel'){ if(!confirm('Apagar esta prática?')) return; const pr=S.practice; const r=S.readings.find(x=>x.id===id); if(pr&&r&&pr.saved&&pr.at===r.at) pr.saved=false; set({readings:S.readings.filter(x=>x.id!==id)}); }
  else if(a==='qstart') set({quiz:{qs:buildQuiz(S.quizScope),i:0,chosen:null,score:0,done:false,answers:[]},quizOpen:null});
  else if(a==='qreset') set({quiz:null,quizOpen:null});
  else if(a==='qhist') set({quizOpen:S.quizOpen===id?null:id});
  else if(a==='qdel'){ if(!confirm('Apagar este quiz do histórico?')) return; if(S.quiz&&S.quiz.histId===id) S.quiz.histId=null; set({quizHistory:S.quizHistory.filter(h=>h.id!==id),quizOpen:null}); }
  else if(a==='pick'){ const q=S.quiz; if(q.chosen!==null) return; q.chosen=+id; const cq=q.qs[q.i], ok=q.chosen===cq.answer; if(ok)q.score++; const op=cq.options.find(o=>o.id===q.chosen); if(!q.answers) q.answers=[]; q.answers.push({c:cq.card.id,k:cq.kind,t:cq.text,img:!!cq.img,ch:q.chosen,ok,lab:op?op.label:''}); render(); const nb=document.querySelector('[data-act="qnext"]'); if(nb) nb.scrollIntoView({behavior:'smooth',block:'end'}); }
  else if(a==='qnext'){ const q=S.quiz, n=q.i+1; q.chosen=null; if(n>=q.qs.length){ q.done=true; S.stats.quizzes++; S.stats.best=Math.max(S.stats.best,q.score); const hid=String(Date.now()); q.histId=hid; S.quizHistory=[{id:hid,at:Date.now(),scope:S.quizScope,score:q.score,total:q.qs.length,answers:q.answers||[]}].concat(S.quizHistory).slice(0,50); persist(); } else q.i=n; render(); document.getElementById('main').scrollTop=0; }
});

render();
if(window.GA_AUTH && window.GA_AUTH.enabled){
  const A=window.GA_AUTH; let authKey='';
  const resetLocal=()=>{ S.studied={}; S.notes={}; S.stats={quizzes:0,best:0}; S.readings=[]; S.quizHistory=[]; S.practice=null; S.quiz=null; S.flash=null; };
  A.iniciar({
    getData: backupData,
    applyData:(d,uid)=>{
      let dono=null; try{ dono=localStorage.getItem('ga-dono'); }catch(e){}
      if(dono && dono!==uid) resetLocal();      // aparelho usado por outra conta: não mistura
      mergeData(d); lastSent=null;
      try{ localStorage.setItem('ga-dono',uid); }catch(e){}
      persist();
      const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if(!typing) render();
    },
    limparLocal:()=>{ resetLocal(); S.screen='home'; lastSent=null; try{ localStorage.removeItem('ga-dono'); }catch(e){} persist(); },
    onChange:()=>{
      const k=[A.estado,A.erro,A.ocupado,A.perfil&&JSON.stringify(A.perfil)].join('|');
      const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&A.estado==='ok';
      if(k!==authKey&&!typing){ authKey=k; render(); }
      const st=document.getElementById('sync-status'); if(st) st.textContent={ok:'Progresso salvo na nuvem',enviando:'Salvando na nuvem…',pendente:'Sem conexão: salvo neste aparelho, sobe para a nuvem quando a internet voltar'}[A.sync]||'';
    }
  });
}
if('serviceWorker' in navigator){
  // Quando um service worker novo assume o controle (deploy novo), recarrega uma vez para mostrar a versão atualizada
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(navigator.serviceWorker.controller && !reloading){ reloading=true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // verifica se há versão nova toda vez que o app volta para o primeiro plano
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
}
})();
</script>
