# Netlify publica a raiz do repositório como está (site estático, sem build).
# Os cabeçalhos de cache ficam no arquivo _headers.
[build]
  publish = "."
  command = ""

# Funções do servidor (webhook da Kiwify)
[functions]
  directory = "netlify/functions"

# O lembrete diário lê as cartas e as perguntas do próprio app
[functions."lembrete-diario"]
  included_files = ["cards.js", "diario.js"]
