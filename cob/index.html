<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>COB · Curso Online de Bruxaria</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="App de quem estuda no Curso Online de Bruxaria da Raquel Lopes: aulas, biblioteca de bruxa(o) e calendário lunar.">
<meta name="theme-color" content="#431E3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--paper:#F4ECE1;--card:#FFFDF9;--line:#E2D3C2;--ink:#402327;--ink2:#5E4038;--muted:#7A5A4E;--plum:#431E3D;--plum2:#5A2A52;--wood:#593122;--caramel:#AD7E62;--pink:#F4B1C8;--butter:#ECDF90;--sand:#EDE1D2;--night:#2A1619;--moonlit:#F3E7C4;--moondark:#4A3340}
@media (prefers-color-scheme:dark){:root{--paper:#171013;--card:#221A1D;--line:#3A2C31;--ink:#F4ECE1;--ink2:#E2D3C8;--muted:#B8A096;--sand:#2E2327;--plum:#E3B6D6;--plum2:#F0CBE4;--night:#0F0A0C;--moondark:#3A2A33}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html{overflow-x:hidden;overflow-x:clip}body{overflow-x:clip}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;line-height:1.1}
p{margin:0;line-height:1.6}
a{color:var(--plum)}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
main{flex:1;min-width:0;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}
main>*{min-width:0}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;border:none;background:transparent;color:var(--muted);font-size:10.5px;font-weight:500}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--plum);font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.h1{font-size:34px}
.h2{font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.night{border:1px solid transparent;background:var(--night);background-image:radial-gradient(circle at 80% 0%,rgba(244,177,200,.18),transparent 55%);color:#F4ECE1;border:none;border-radius:22px;padding:20px;display:flex;gap:18px;align-items:center}
.night .eyebrow{color:var(--pink)}
.night p{color:#E6D8CA}
.btn{min-height:50px;border:none;border-radius:14px;background:var(--plum);color:#FFFDF9;font-size:15px;font-weight:600;padding:0 18px;width:100%}
@media (prefers-color-scheme:dark){.btn{color:#2A1619}.night{border-color:var(--line)}}
.btn.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .n{font-size:16px;font-weight:600}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ic{width:42px;height:42px;border-radius:12px;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--plum);flex-shrink:0}
.row .ic svg{width:20px;height:20px}
.chev{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.pills::-webkit-scrollbar{display:none}
.pill{min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;font-weight:500;white-space:nowrap}
.pill.on{border-color:var(--plum);background:var(--plum);color:#FFFDF9;font-weight:600}
@media (prefers-color-scheme:dark){.pill.on{color:#2A1619}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 10px;border-radius:99px;background:var(--sand);color:var(--ink2);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:10px}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.warn{border-left:3px solid var(--caramel);background:var(--sand);padding:10px 12px;border-radius:0 12px 12px 0;font-size:14px;color:var(--ink2)}
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:4px 0;color:var(--muted);font-size:14px;min-height:40px}
.back svg{width:18px;height:18px}
.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.bar{height:6px;border-radius:99px;background:var(--sand);overflow:hidden}.bar i{display:block;height:100%;background:var(--plum);border-radius:99px}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--night)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#E6D8CA;height:100%;text-align:center;padding:16px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;resize:vertical}
.done{display:inline-flex;align-items:center;gap:6px;color:#3F6E4A;font-weight:600;font-size:13px}
@media (prefers-color-scheme:dark){.done{color:#9CCB9F}}
.moon{flex-shrink:0;display:block}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding:4px 0}
.cal button{position:relative;aspect-ratio:1/1.12;border:1px solid transparent;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:6px 0 0;font-size:14px;font-weight:500}
.cal button.out{visibility:hidden}
.cal button.hoje{border-color:var(--plum)}
.cal button.sel{background:var(--plum);color:#FFFDF9}
@media (prefers-color-scheme:dark){.cal button.sel{color:#2A1619}}
.cal button .dot{position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--caramel)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.calhead button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.calhead button svg{width:18px;height:18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex-shrink:0}
footer.note{font-size:12.5px;color:var(--muted);line-height:1.6}
/* conta */
main.portao{padding-top:28px}
.auth{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.auth .c{text-align:center;align-self:center}
.auth p.c{color:var(--ink2);font-size:15px}
.auth-form{display:flex;flex-direction:column;gap:14px}
.marca{display:flex;flex-direction:column;align-items:center;gap:8px}
.marca img{width:72px;height:72px;border-radius:18px;display:block}
.field input[type=email],.field input[type=tel],.field input[type=date]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.auth .field input[type=text],.auth .field select{background:var(--card)}
.field input:disabled{opacity:.7}
.field input[type=date]{display:block;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);line-height:1.5}
.check input{width:22px;height:22px;flex-shrink:0;margin:1px 0 0;accent-color:var(--plum)}
.lk{border:none;background:none;padding:0;color:var(--plum);text-decoration:underline;font:inherit;font-weight:500;cursor:pointer}
.dica{font-size:13px;color:var(--muted);line-height:1.5}
.ob{color:#9B3B3B;font-style:normal}
.invalido input,.invalido select,input.invalido{border-color:#B44A4A!important;box-shadow:0 0 0 3px rgba(180,74,74,.15)}
.check.invalido,.radio.invalido{outline:2px solid #B44A4A;outline-offset:4px;border-radius:8px}
@media (prefers-color-scheme:dark){.ob{color:#F0B8B8}}
.resp{background:var(--sand);border-color:transparent}
.radio{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink2)}
.radio legend{font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
.radio label{display:flex;gap:10px;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.radio input{width:20px;height:20px;margin:0;accent-color:var(--plum)}
.doc h3{font-size:20px;margin:6px 0 0}
.doc p,.doc li{font-size:14.5px;color:var(--ink2);line-height:1.6}
.doc ul,.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lacuna{background:#FCEFC7;color:#7A4B00;padding:0 4px;border-radius:4px}
@media (prefers-color-scheme:dark){.lacuna{background:#4A3A12;color:#F5DD9B}}
a.pill{text-decoration:none;display:inline-flex;align-items:center}
.conta{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:13px;color:var(--muted);padding:10px 0 4px;border-top:1px solid var(--line)}
.conta .lk{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:24px;font-family:'Cormorant Garamond',Georgia,serif}.stats span{font-size:12px;color:var(--muted)}
.mb{background:var(--card);border:1px solid var(--line);border-radius:14px}
.mb summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.mb summary::-webkit-details-marker{display:none}
.mb summary>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.mb summary small{font-size:12.5px;color:var(--muted)}
.mb .kv{padding:0 14px 14px;font-size:13.5px;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);overflow-wrap:anywhere}
.hist small{color:var(--muted)}
.hist i{font-style:normal;font-weight:600;color:var(--muted)}.hist i.baixar{color:var(--plum)}
[hidden]{display:none!important}
/* leitor de PDF */
main.cheia{padding:0;gap:0}
.leitor{display:flex;flex-direction:column;min-height:100%}
.lbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.lbar .lt{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar button,.lbar a{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;font-size:13px;font-weight:600}
.lbar button:disabled{opacity:.4}
.lbar svg{width:18px;height:18px}
.lpag{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:52px;text-align:center}
.lpaginas{flex:1;background:#3A2C31;padding:10px 0 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (prefers-color-scheme:light){.lpaginas{background:#D9CDBF}}
.pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);position:relative}
.pg canvas{display:block;width:100%;height:100%}
.pg .num{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:2px 6px;border-radius:99px}
.lmsg{color:var(--muted);font-size:14px;padding:40px 20px;text-align:center}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.gl{display:flex;flex-direction:column;gap:8px}
.gl details{background:var(--card);border:1px solid var(--line);border-radius:14px}
.gl summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;font-size:15.5px;font-weight:600;min-height:48px}
.gl summary::-webkit-details-marker{display:none}
.gl summary svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;transition:transform .2s}
.gl details[open] summary svg{transform:rotate(90deg)}
.gl details p{padding:0 16px 14px;font-size:15px;color:var(--ink2)}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink2);line-height:1.5}
.sug{display:flex;gap:12px;align-items:flex-start}
.sug .sw{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:4px;border:1px solid rgba(0,0,0,.15)}
.next{display:flex;flex-direction:column;gap:8px}
/* estante */
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.book{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.book .bt,.book .ba,.book .bd{overflow-wrap:anywhere}.book .rm{padding:0 6px;white-space:nowrap}
.cover{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#431E3D;display:flex;align-items:flex-end;padding:12px;color:#F4ECE1;box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ph{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.1;position:relative;min-width:0;overflow-wrap:anywhere}
.book .bc{align-self:flex-start;font-size:11px;letter-spacing:.04em;color:var(--muted);background:var(--sand);padding:3px 8px;border-radius:99px}
.book .bt{font-size:15px;font-weight:600;line-height:1.25}
.book .ba{font-size:12.5px;color:var(--muted)}
.book .bd{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book .acoes{display:flex;gap:6px;margin-top:auto}
.book .btn{min-height:44px;font-size:14px;border-radius:12px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;padding:0 8px}
.book .btn.ghost{flex:0 0 44px;padding:0}
.book .btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.field textarea{min-height:80px}
.field input[type=file]{font-size:14px;color:var(--ink2);max-width:100%;min-width:0}
.field select,.ed select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.msg{overflow-wrap:anywhere}
.ebusca{display:flex;flex-direction:column;gap:10px}
.econta{font-size:13px;color:var(--muted)}
.msg{font-size:14px;color:var(--ink2);padding:10px 12px;border-radius:12px;background:var(--sand)}
.msg.erro{background:#FBEDED;color:#7E2C2C}
@media (prefers-color-scheme:dark){.msg.erro{background:#3A2225;color:#F0B8B8}}
.link{border:none;background:none;padding:6px 0;color:var(--muted);font-size:13px;text-decoration:underline;min-height:40px}
.buy{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:10px;border:1px dashed var(--line);color:var(--plum);font-size:13px;font-weight:600;text-decoration:none}
.buy svg{width:14px;height:14px}
.adm-tabs{display:flex;gap:6px}.adm-tabs .pill{flex:1;white-space:normal;line-height:1.25}
.lote{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.lote .li{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.lote .li input{grid-column:1/-1;width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:6px 10px;font:inherit;font-size:16px}
.lote .li small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lote .st{font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{color:#3F6E4A}.st.erro{color:#7E2C2C}.st.vai{color:var(--plum)}
@media (prefers-color-scheme:dark){.st.ok{color:#9CCB9F}.st.erro{color:#F0B8B8}}
.ed{display:flex;flex-direction:column;gap:8px}
.ed input,.ed textarea,.ed select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:6px 10px;font:inherit;font-size:16px}
.ed textarea{min-height:64px}
.ed .row2{display:flex;gap:6px}.ed .row2 button{flex:1}
.rm{min-height:40px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#7E2C2C;font-size:13px;font-weight:500;padding:0 12px}
@media (prefers-color-scheme:dark){.rm{color:#F0B8B8}}
@media (min-width:900px){
  #app{max-width:1080px;flex-direction:row}
  nav{order:-1;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;width:220px;border-top:none;border-right:1px solid var(--line);padding:28px 14px;justify-content:flex-start}
  nav::before{content:'COB';font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:700;color:var(--plum);padding:0 12px 18px}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:12px;font-size:15px;min-height:46px}
  nav button.on{background:var(--sand)}
  main{padding:36px 40px 48px;max-width:820px}
  .h1{font-size:42px}
  .cal button{aspect-ratio:auto;height:68px}
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
}
</style>
</head>
<body>
<div id="app"><main id="main"></main><nav id="nav"></nav></div>
<script src="lua.js?v=1"></script>
<script src="biblioteca.js?v=3"></script>
<script src="aulas.js?v=1"></script>
<script src="termos.js?v=2"></script>
<script src="config.js"></script>
<script>
(function(){
const B=window.BIBLIOTECA, A=window.AULAS, L=window.LUA;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- estado salvo no aparelho ----------
let S={feitas:{},notas:{},hemisferio:'sul'};
try{Object.assign(S,JSON.parse(localStorage.getItem('cob')||'{}'));}catch(e){}
const salvar=()=>{try{localStorage.setItem('cob',JSON.stringify(S));}catch(e){}};

// ---------- ícones ----------
const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

// ---------- desenho da Lua ----------
// ilum: fração iluminada (0 a 1); crescendo: true entre a Nova e a Cheia
function luaSvg(ilum,crescendo,tam){
  const r=48;
  let lit='';
  if(ilum>0.985)lit=`<circle r="${r}" fill="var(--moonlit)"/>`;
  else if(ilum>0.015){
    const rx=Math.abs(1-2*ilum)*r;
    const inner=ilum<0.5?0:1;
    // no hemisfério norte a Lua crescente acende pela direita; no sul, pela esquerda
    let dir=crescendo?1:-1; if(S.hemisferio!=='norte')dir=-dir;
    lit=`<path transform="scale(${dir},1)" d="M0,-${r} A${r},${r} 0 0 1 0,${r} A${rx.toFixed(2)},${r} 0 0 ${inner} 0,-${r}Z" fill="var(--moonlit)"/>`;
  }
  return `<svg class="moon" width="${tam}" height="${tam}" viewBox="-50 -50 100 100" aria-hidden="true"><circle r="48" fill="var(--moondark)"/>${lit}<circle r="48" fill="none" stroke="rgba(243,231,196,.35)" stroke-width="1.5"/></svg>`;
}
const CRESCE=new Set(['nova','crescente','quarto-crescente','crescente-gibosa']);
function luaDoDia(d){
  const f=L.faseDoDia(d);
  const ilumFase={nova:0,'quarto-crescente':0.5,cheia:1,'quarto-minguante':0.5};
  // fora do dia exato da Nova, mantém um fio de luz visível no desenho
  const ilum=f.exata?ilumFase[f.fase]:Math.max(f.ilum,0.07);
  const crescendo=f.idade<14.765;
  const ilumReal=f.exata?ilumFase[f.fase]:f.ilum;
  return {...f,ilum,ilumReal,crescendo,info:B.lua[f.fase]};
}

const T=window.COB_TERMOS;
const G={leituras:null,maba:'membros',lbusca:'',off:false,pronto:false,sessao:null,perfil:null,admin:false,aba:'cadastro',etapa:'form',email:'',msg:'',erro:false,ocupado:false,form:{},espera:0,membros:null,mbusca:''};
const PEND='cob-cadastro', URL_APP=location.origin+location.pathname.replace(/index\.html$/,'');
const so=t=>String(t||'').replace(/\D/g,'');
function cpfOk(c){c=so(c);if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  for(const n of [9,10]){let s=0;for(let i=0;i<n;i++)s+=+c[i]*(n+1-i);let r=s*10%11;if(r===10)r=0;if(r!==+c[n])return false;}return true;}
const fmtCpf=c=>{c=so(c).slice(0,11);return c.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2');};
const fmtTel=t=>{t=so(t).slice(0,11);if(t.length<3)return t;const d=t.slice(0,2),r=t.slice(2);return `(${d}) `+(r.length>8?r.slice(0,5)+'-'+r.slice(5):r.length>4?r.slice(0,4)+'-'+r.slice(4):r);};
function idadeDe(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return null;const [a,m,d]=iso.split('-').map(Number),h=new Date();let i=h.getFullYear()-a;if(h.getMonth()+1<m||(h.getMonth()+1===m&&h.getDate()<d))i--;return i;}
const emailOk=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e||'');
const lerPend=()=>{try{return JSON.parse(localStorage.getItem(PEND)||'null');}catch(e){return null;}};
const aviso2=(t,erro)=>{G.msg=t;G.erro=!!erro;render(true);};
function erroConta(e){
  const m=String(e&&(e.message||e.error_description||e.error)||e||'');
  return /cob_membros_cpf_key|duplicate key/i.test(m)?'Este CPF já tem cadastro. Entre com o e-mail usado nele, ou fale com a moderação.'
    :/cpf_invalido/.test(m)?'O CPF não é válido. Confira os números.'
    :/idade_minima/.test(m)?'A comunidade é para pessoas com 16 anos ou mais.'
    :/responsavel_incompleto/.test(m)?'Para 16 e 17 anos, preencha todos os dados do responsável e a declaração.'
    :/nome_incompleto/.test(m)?'Escreva o nome completo (nome e sobrenome).'
    :/whatsapp_invalido/.test(m)?'O WhatsApp precisa ter DDD e número.'
    :/nascimento_invalido/.test(m)?'Confira a data de nascimento.'
    :/sem_aceite/.test(m)?'É preciso marcar o aceite dos termos.'
    :/cob_membros|relation .* does not exist|schema cache/i.test(m)?'O cadastro ainda não foi ativado no Supabase (falta rodar o SQL do COB).'
    :/rate limit|too many|seconds/i.test(m)?'Muitos pedidos seguidos. Espere um minuto e tente de novo.'
    :/Signups not allowed|not found|Invalid login/i.test(m)?'Não achei cadastro com esse e-mail. Toque em "Criar conta".'
    :/expired|invalid.*token|otp/i.test(m)?'Código inválido ou vencido. Peça um novo.'
    :/Failed to fetch|NetworkError|network/i.test(m)?'Sem conexão. Confira a internet e tente de novo.':m;
}
// valida o formulário; devolve {dados} ou {erro}
function validarCadastro(f,comEmail){
  const nome=(f.nome||'').trim().replace(/\s+/g,' '), idade=idadeDe(f.nasc);
  if(!/\S+\s+\S+/.test(nome))return {erro:'Escreva o nome completo (nome e sobrenome).',campo:'nome'};
  if(!cpfOk(f.cpf))return {erro:'O CPF não é válido. Confira os números.',campo:'cpf'};
  if(comEmail&&!emailOk((f.email||'').trim()))return {erro:'Digite um e-mail válido.',campo:'email'};
  if(so(f.whats).length<10)return {erro:'O WhatsApp precisa ter DDD e número.',campo:'whats'};
  if(idade===null||idade>110||idade<0)return {erro:'Preencha a data de nascimento.',campo:'nasc'};
  if(idade<16)return {erro:'A comunidade é para pessoas com 16 anos ou mais.',campo:'nasc'};
  const d={nome,cpf:so(f.cpf),whatsapp:so(f.whats),nascimento:f.nasc,aceite:!!f.aceite,aceite_versao:T.VERSAO};
  if(idade<18){
    if(!/\S+\s+\S+/.test((f.rnome||'').trim()))return {erro:'Escreva o nome completo do responsável.',campo:'rnome'};
    if(!cpfOk(f.rcpf)||so(f.rcpf)===so(f.cpf))return {erro:'O CPF do responsável não é válido (e precisa ser diferente do seu).',campo:'rcpf'};
    if(so(f.rtel).length<10)return {erro:'Preencha o telefone do responsável com DDD.',campo:'rtel'};
    if(!emailOk((f.remail||'').trim()))return {erro:'Preencha o e-mail do responsável.',campo:'remail'};
    if(!f.rpar)return {erro:'Escolha o parentesco do responsável.',campo:'rpar'};
    if(f.rimg!=='sim'&&f.rimg!=='nao')return {erro:'O responsável precisa escolher se autoriza ou não câmera e microfone nas aulas.',campo:'rimg'};
    if(!f.rdecl)return {erro:'O responsável precisa marcar a declaração.',campo:'rdecl'};
    Object.assign(d,{resp_nome:f.rnome.trim(),resp_cpf:so(f.rcpf),resp_telefone:so(f.rtel),resp_email:f.remail.trim().toLowerCase(),resp_parentesco:f.rpar,resp_imagem:f.rimg==='sim',resp_declara:true});
  }
  if(!d.aceite)return {erro:'Para continuar, marque que leu e concorda com os termos.',campo:'aceite'};
  return {dados:d};
}
async function gravarCadastro(dados){
  const sb=await carregarSupabase();
  const {data,error}=await sb.from('cob_membros').insert(dados).select().single();
  if(error)throw error;
  try{localStorage.removeItem(PEND);}catch(e){}
  G.perfil=data;
}
async function registrarAcesso(){
  try{const ult=+localStorage.getItem('cob-acesso-em')||0;if(Date.now()-ult<30*60000)return;localStorage.setItem('cob-acesso-em',String(Date.now()));
    const sb=await carregarSupabase();const {error}=await sb.from('cob_acessos').insert({});if(error)localStorage.removeItem('cob-acesso-em');}catch(e){}
}
// verifyOtp e o aviso SIGNED_IN chegam juntos: uma entrada por usuário de cada vez, para não gravar o cadastro duas vezes
let entrando=null;
function aoEntrar(ses){
  if(entrando&&entrando.id===ses.user.id)return entrando.p;
  const p=entrar_(ses).finally(()=>{if(entrando&&entrando.p===p)entrando=null;});
  entrando={id:ses.user.id,p};return p;
}
async function entrar_(ses){
  G.sessao=ses;E.sessao=ses;G.email=(ses.user.email||'').toLowerCase();
  const sb=await carregarSupabase();
  const [p,a]=await Promise.all([sb.from('cob_membros').select('*').eq('user_id',ses.user.id).maybeSingle(),sb.rpc('e_admin')]);
  G.admin=E.admin=!!a.data;G.perfil=p.data||null;
  if(!G.perfil&&!G.admin){
    const pend=lerPend();
    if(pend&&pend.email===G.email){
      const {email,form,...dados}=pend;
      try{await gravarCadastro(dados);}catch(e){G.form={...G.form,...pend.form};G.msg=erroConta(e);G.erro=true;}
    }
  }
  if(G.perfil||G.admin)registrarAcesso();
}
async function iniciarConta(){
  // volta do link mágico: o token vem depois do # e o pdf.js/rotas não devem vê-lo
  const h=location.hash, doLink=/access_token=|error_description=/.test(h);
  let erroLink='';
  if(/error_description=/.test(h)){const q=new URLSearchParams(h.slice(1));erroLink=/expired|invalid/i.test(q.get('error_code')+q.get('error_description'))?'O link venceu ou já foi usado. Peça um novo abaixo.':'Não consegui entrar com esse link. Peça um novo abaixo.';}
  try{
    const sb=await carregarSupabase();
    // enquanto o SQL do cadastro não foi rodado no Supabase, o app segue aberto como antes (sem portão)
    const t=await sb.from('cob_membros').select('user_id').limit(0);
    if(t.error&&(/PGRST205|42P01/.test(t.error.code||'')||t.status===404)){G.off=true;G.pronto=true;render();return;}
    const {data}=await sb.auth.getSession();
    if(data&&data.session)await aoEntrar(data.session);
    sb.auth.onAuthStateChange((ev,ses)=>{
      if(ev==='SIGNED_IN'&&ses&&(!G.sessao||G.sessao.user.id!==ses.user.id)){aoEntrar(ses).then(()=>render());}
      if(ev==='SIGNED_OUT'){G.sessao=null;G.perfil=null;G.admin=E.admin=false;E.sessao=null;render();}
    });
  }catch(e){G.msg=navigator.onLine?'Não consegui conectar agora. Tente de novo em instantes.':'Sem internet. Conecte-se para entrar.';G.erro=true;}
  if(erroLink){G.aba='entrar';G.etapa='form';G.msg=erroLink;G.erro=true;}
  if(doLink)history.replaceState(null,'',location.pathname+'#/hoje');
  G.pronto=true;render();
}
async function contaAcao(a,v){
  if(a==='aba'){G.aba=v;G.etapa='form';G.msg='';render(true);return;}
  if(a==='voltar'){G.etapa='form';G.msg='';render(true);return;}
  if(a==='cadastrar'||a==='completar'){
    const r=validarCadastro(G.form,a==='cadastrar');if(r.erro){G.campo=r.campo||'';aviso2(r.erro,true);return marcarCampo();}
    G.campo='';
    G.ocupado=true;aviso2('');
    if(a==='completar'){try{await gravarCadastro(r.dados);G.ocupado=false;G.msg='';registrarAcesso();render();}catch(e){G.ocupado=false;aviso2(erroConta(e),true);}return;}
    const email=G.form.email.trim().toLowerCase();
    try{localStorage.setItem(PEND,JSON.stringify({...r.dados,email,form:{...G.form,aceite:false,rdecl:false}}));}catch(e){}
    return enviarLink(email,true);
  }
  if(a==='entrar'){
    const email=(G.form.lemail||'').trim().toLowerCase();if(!emailOk(email))return aviso2('Digite o e-mail do seu cadastro.',true);
    return enviarLink(email,false);
  }
  if(a==='reenviar'){if(Date.now()<G.espera)return;return enviarLink(G.email,G.aba==='cadastro');}
  if(a==='codigo'){
    const tok=so(G.form.codigo);if(tok.length<6)return aviso2('Digite o código de 6 dígitos do e-mail.',true);
    G.ocupado=true;aviso2('');
    try{const sb=await carregarSupabase();const {data,error}=await sb.auth.verifyOtp({email:G.email,token:tok,type:'email'});if(error)throw error;await aoEntrar(data.session);G.ocupado=false;G.msg='';render();}
    catch(e){G.ocupado=false;aviso2(erroConta(e),true);}
    return;
  }
  if(a==='sair'){try{const sb=await carregarSupabase();await sb.auth.signOut();}catch(e){}G.sessao=null;G.perfil=null;G.admin=E.admin=false;E.sessao=null;G.aba='entrar';G.etapa='form';G.msg='';G.membros=null;G.leituras=null;ir('hoje');render();return;}
  if(a==='csv')return baixarCsv();
  if(a==='csvl')return baixarCsvLeituras();
  if(a==='maba'){G.maba=v;render(true);return;}
}
async function enviarLink(email,novo){
  G.ocupado=true;G.email=email;aviso2('');
  try{
    const sb=await carregarSupabase();
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:novo,emailRedirectTo:URL_APP}});
    if(error)throw error;
    G.ocupado=false;G.etapa='enviado';G.form.codigo='';G.espera=Date.now()+60000;G.msg='';render(true);
    setTimeout(()=>{if(G.etapa==='enviado')render(true);},60500);
  }catch(e){G.ocupado=false;aviso2(erroConta(e),true);}
}
// campos do formulário: o valor fica em G.form (não se perde ao trocar de tela) e CPF/telefone ganham máscara
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.f;if(!k)return;
  if(e.target.type==='checkbox')G.form[k]=e.target.checked;
  else if(e.target.type==='radio'){if(e.target.checked)G.form[k]=e.target.value;}
  else{
    if(e.target.dataset.mask==='cpf'){const v=fmtCpf(e.target.value);if(v!==e.target.value)e.target.value=v;}
    if(e.target.dataset.mask==='tel'){const v=fmtTel(e.target.value);if(v!==e.target.value)e.target.value=v;}
    G.form[k]=e.target.value;
  }
  if(k==='nasc')mostrarResponsavel();
  const box=e.target.closest('.invalido');if(box)box.classList.remove('invalido');
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k&&(e.target.type==='radio'||e.target.tagName==='SELECT'||e.target.type==='date')){G.form[k]=e.target.value;if(k==='nasc')mostrarResponsavel();}});
function marcarCampo(){
  const el=G.campo&&document.querySelector(`[data-f="${G.campo}"]`);if(!el)return;
  const alvo=el.closest('.field,.check,.radio')||el;alvo.classList.add('invalido');
  alvo.scrollIntoView({behavior:'instant',block:'center'});if(el.type!=='radio'&&el.type!=='checkbox')el.focus({preventScroll:true});
}
function mostrarResponsavel(){
  const i=idadeDe(G.form.nasc), r=$('#c-resp'), av=$('#c-idade');
  if(r)r.hidden=!(i!==null&&i>=16&&i<18);
  if(av){av.hidden=!(i!==null&&i<16&&i>=0);}
}

// ---------- Quem leu ou baixou cada livro (cob_leituras) ----------
// "Ler" conta uma vez a cada 30 min por livro; cada toque em baixar conta sempre.
const regLeitura={};
function registrarLeitura(id,tipo){
  const k=tipo+':'+id, agora=Date.now();
  if(tipo==='ler'&&regLeitura[k]&&agora-regLeitura[k]<30*60000)return;
  regLeitura[k]=agora;
  carregarSupabase().then(sb=>sb.from('cob_leituras').insert({livro_id:+id,tipo})).catch(()=>{});
}
async function carregarLeituras(){
  try{
    const sb=await carregarSupabase();let todas=[];
    for(let i=0;i<20000;i+=1000){
      const {data,error}=await sb.from('cob_leituras').select('*').order('em',{ascending:false}).range(i,i+999);
      if(error)throw error;todas=todas.concat(data);if(data.length<1000)break;
    }
    G.leituras=todas;
  }catch(e){G.leituras={erro:/cob_leituras|does not exist|schema cache/i.test(String(e&&e.message))?'O registro de leituras ainda não foi ativado (falta rodar o SQL).':erroConta(e)};}
  if(rota()[0]==='membros')render(true);
}
const nomeDe=uid=>{const m=Array.isArray(G.membros)&&G.membros.find(x=>x.user_id===uid);return m?m.nome:'Admin (sem cadastro)';};
const rotTipo=t=>t==='baixar'?'baixou':'leu';
function leiturasDo(uid){
  if(!Array.isArray(G.leituras))return '';
  const l=G.leituras.filter(x=>x.user_id===uid);
  if(!l.length)return `<p class="dica" style="padding:0 14px 14px">Ainda não leu nem baixou nenhum livro.</p>`;
  const b=l.filter(x=>x.tipo==='baixar').length;
  return `<div class="hist"><b>Estante: ${l.length-b} leitura(s), ${b} download(s)</b>${l.slice(0,15).map(x=>`<span><i class="${x.tipo}">${rotTipo(x.tipo)}</i> ${esc(x.titulo||'—')} · ${dataHora(x.em)}</span>`).join('')}${l.length>15?`<small>e mais ${l.length-15} na planilha de leituras</small>`:''}</div>`;
}
function painelLivros(){
  if(G.leituras===null)return `<div class="card"><p style="color:var(--muted)">Carregando…</p></div>`;
  if(G.leituras.erro)return `<p class="msg erro">${esc(G.leituras.erro)}</p>`;
  const por={};G.leituras.forEach(x=>{const k=x.livro_id||('t:'+x.titulo);(por[k]=por[k]||{titulo:x.titulo,ler:0,baixar:0,itens:[]});por[k][x.tipo]++;por[k].itens.push(x);});
  const q=semAcento(G.lbusca||'').trim();
  const lista=Object.values(por).filter(x=>!q||semAcento(x.titulo).includes(q)).sort((a,b)=>(b.ler+b.baixar)-(a.ler+a.baixar));
  if(!G.leituras.length)return `<div class="card"><p>Ninguém leu ou baixou livros ainda. Os registros começam a aparecer aqui a partir de agora.</p></div>`;
  return `<input class="search" id="l-busca" type="search" placeholder="Buscar livro" value="${esc(G.lbusca||'')}" autocomplete="off">
  <p class="econta">${lista.length} livro(s) com atividade · ${G.leituras.length} registro(s) nos últimos 6 meses</p>
  <div class="list" id="l-lista">${lista.map(x=>{const pessoas={};x.itens.forEach(i=>{const p=pessoas[i.user_id]=pessoas[i.user_id]||{ler:0,baixar:0,ult:i.em};p[i.tipo]++;});
    return `<details class="mb"><summary><span><b>${esc(x.titulo||'—')}</b><small>${x.ler} leitura(s) · ${x.baixar} download(s) · ${Object.keys(pessoas).length} pessoa(s)</small></span></summary>
    <div class="hist">${Object.entries(pessoas).map(([u,p])=>`<span>${esc(nomeDe(u))} · ${p.ler?`leu ${p.ler}x`:''}${p.ler&&p.baixar?', ':''}${p.baixar?`<i class="baixar">baixou ${p.baixar}x</i>`:''} · último ${dataHora(p.ult)}</span>`).join('')}</div></details>`;}).join('')}</div>`;
}
document.addEventListener('input',e=>{if(e.target.id==='l-busca'){G.lbusca=e.target.value;const pos=e.target.selectionStart;render(true);const n=$('#l-busca');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
function baixarCsvLeituras(){
  const m=uid=>(Array.isArray(G.membros)&&G.membros.find(x=>x.user_id===uid))||{};
  const q=x=>{let s=x==null?'':String(x);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const linhas=[['Data','Ação','Livro','Nome','E-mail','CPF','WhatsApp','IP','Aparelho'].map(q).join(';')]
    .concat((G.leituras||[]).map(x=>{const p=m(x.user_id);return [new Date(x.em).toLocaleString('pt-BR'),x.tipo==='baixar'?'baixou':'leu',x.titulo,p.nome||'Admin (sem cadastro)',p.email,p.cpf,p.whatsapp,x.ip,x.ua].map(q).join(';');}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`leituras-cob-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

async function carregarMembros(){
  try{const sb=await carregarSupabase();const {data,error}=await sb.from('cob_membros').select('*').order('criado_em',{ascending:false});if(error)throw error;G.membros=data;}
  catch(e){G.membros={erro:erroConta(e)};}
  if(rota()[0]==='membros')render(true);

const dataHora=s=>s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function membrosFiltrados(){
  const q=semAcento(G.mbusca).trim(), qd=so(q), l=Array.isArray(G.membros)?G.membros:[];
  return q?l.filter(m=>semAcento(m.nome+' '+m.email).includes(q)||(qd.length>=3&&(m.cpf.includes(qd)||m.whatsapp.includes(qd)))):l;
}
function listaMembros(){
  const l=membrosFiltrados();

    <dl class="kv"><dt>CPF</dt><dd>${esc(fmtCpf(m.cpf))}</dd><dt>WhatsApp</dt><dd><a href="https://wa.me/55${esc(so(m.whatsapp).replace(/^55(?=\d{10,11}$)/,''))}" target="_blank" rel="noopener">${esc(fmtTel(m.whatsapp))}</a></dd>
    <dt>Nascimento</dt><dd>${esc(m.nascimento.split('-').reverse().join('/'))} (${i} anos)</dd><dt>Último acesso</dt><dd>${dataHora(m.ultimo_acesso)}</dd>
    <dt>Aceite</dt><dd>${dataHora(m.aceite_em)} · versão ${esc(m.aceite_versao||'—')}${m.aceite_ip?` · IP ${esc(m.aceite_ip)}`:''}</dd>
    ${m.resp_nome?`<dt>Responsável</dt><dd>${esc(m.resp_nome)} (${esc(m.resp_parentesco)}) · CPF ${esc(fmtCpf(m.resp_cpf))} · ${esc(fmtTel(m.resp_telefone))} · ${esc(m.resp_email)} · imagem: ${m.resp_imagem?'autoriza':'não autoriza'}</dd>`:''}</dl>${leiturasDo(m.user_id)}</details>`;}).join('');

function baixarCsv(){
  const cols=[['nome','Nome'],['cpf','CPF'],['email','E-mail'],['whatsapp','WhatsApp'],['nascimento','Nascimento'],['criado_em','Cadastro'],['ultimo_acesso','Último acesso'],['aceite_versao','Versão dos termos'],['aceite_em','Aceite em'],['aceite_ip','IP do aceite'],['resp_nome','Responsável'],['resp_cpf','CPF do responsável'],['resp_telefone','Telefone do responsável'],['resp_email','E-mail do responsável'],['resp_parentesco','Parentesco'],['resp_imagem','Imagem autorizada']];
  const q=x=>{let s=x==null?'':String(x);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const linhas=[cols.map(c=>q(c[1])).join(';')].concat(membrosFiltrados().map(m=>cols.map(c=>q(m[c[0]])).join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`membros-cob-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

  return '';
}

const TIPOS_EXT={mp4:'video/mp4',mov:'video/quicktime',m4v:'video/x-m4v',webm:'video/webm',pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp'};
const extDe=n=>(String(n).match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase();
function avisoAula(t,erro){M.msg=t;M.erroMsg=!!erro;const el=$('#aula-msg');if(el){el.textContent=t;el.hidden=!t;el.classList.toggle('erro',!!erro);}}
async function subirArquivoAula(sb,aulaId,file,rotulo){
  const ext=extDe(file.name), tipo=TIPOS_EXT[ext]||file.type;
  if(!tipo)throw new Error('Tipo de arquivo não aceito: .'+ext);
  if(file.size>LIMITE_AULA_MB*1048576)throw new Error(`O arquivo passa de ${LIMITE_AULA_MB} MB.`);
  const caminho=`${aulaId}/${Date.now()}-${slug(file.name.replace(/\.[^.]+$/,''))}.${ext}`;
  const prog=f=>avisoAula(`${rotulo}: ${f>=1?'concluindo…':Math.round(f*100)+'%'} (não feche a página)`);
  if(file.size>BLOCO)await enviarRetomavel(sb,caminho,file,tipo,prog,BUCKET_AULAS);
  else{const up=await sb.storage.from(BUCKET_AULAS).upload(caminho,file,{contentType:tipo,upsert:false});if(up.error)throw up.error;}
  return caminho;
}
async function aulaAcao(a,v){
  const sb=await carregarSupabase();
  if(a==='video'){
    const file=($('#aula-video')||{}).files&&$('#aula-video').files[0], link=(($('#aula-link')||{}).value||'').trim();
    if(!file&&!link)return avisoAula('Escolha um arquivo de vídeo ou cole um link.',true);
    if(!file&&!linkOk(link))return avisoAula('O link precisa começar com https://',true);
    M.ocupado=true;render(true);avisoAula(file?'Enviando o vídeo…':'Salvando o link…');
    const antigo=midiaDe(v).video;
    try{
      const linha={aula_id:v,tipo:'video',titulo:file?file.name:link,ordem:0};
      if(file){linha.arquivo=await subirArquivoAula(sb,v,file,'Enviando o vídeo');linha.tamanho=file.size;linha.nome_arquivo=file.name;}else linha.link=link;
      const ins=await sb.from('cob_aula_midia').insert(linha);
      if(ins.error){if(linha.arquivo)await sb.storage.from(BUCKET_AULAS).remove([linha.arquivo]);throw ins.error;}
      if(antigo){await sb.from('cob_aula_midia').delete().eq('id',antigo.id);if(antigo.arquivo)await sb.storage.from(BUCKET_AULAS).remove([antigo.arquivo]);}
      M.ocupado=false;M.porAula=null;await carregarMidia();avisoAula('Vídeo salvo. A turma já vê na aula.');
    }catch(e){M.ocupado=false;render(true);avisoAula('Não deu certo: '+msgErro(e),true);}
    return;
  }
  if(a==='apostilas'){
    const fs=[...((($('#aula-apostilas')||{}).files)||[])];if(!fs.length)return avisoAula('Escolha um ou mais arquivos.',true);
    M.ocupado=true;render(true);
    const base=midiaDe(v).apostilas.length;let ok=0,erros=[];
    for(const [k,f] of fs.entries()){
      try{
        const caminho=await subirArquivoAula(sb,v,f,`Apostila ${k+1} de ${fs.length}`);
        const ins=await sb.from('cob_aula_midia').insert({aula_id:v,tipo:'apostila',titulo:tituloDoArquivo(f.name),arquivo:caminho,tamanho:f.size,nome_arquivo:f.name,ordem:base+k+1});
        if(ins.error){await sb.storage.from(BUCKET_AULAS).remove([caminho]);throw ins.error;}
        ok++;
      }catch(e){erros.push(f.name+': '+msgErro(e));}
    }
    M.ocupado=false;M.porAula=null;await carregarMidia();
    avisoAula(erros.length?`${ok} enviada(s); com erro: ${erros.join(' · ')}`:`${ok} apostila(s) na aula.`,!!erros.length);
    return;
  }
  if(a==='remover'){
    const l=Object.values(M.porAula||{}).flat().find(x=>String(x.id)===String(v));if(!l)return;
    if(!confirm(`Remover "${l.titulo}" desta aula? A turma deixa de ver.`))return;
    try{const del=await sb.from('cob_aula_midia').delete().eq('id',l.id);if(del.error)throw del.error;if(l.arquivo)await sb.storage.from(BUCKET_AULAS).remove([l.arquivo]);M.porAula=null;await carregarMidia();avisoAula('Removido.');}
    catch(e){avisoAula('Não consegui remover: '+msgErro(e),true);}
  }
}

const ASSIN={};let assinEm=0,assinando=null;
function assinar(){
  if(assinando)return assinando;
  return assinando=(async()=>{
    const sb=await carregarSupabase(), l=E.livros||[];
    const caminhos=[...new Set(l.flatMap(x=>[x.arquivo,x.capa]).filter(Boolean))];
    for(let i=0;i<caminhos.length;i+=500){
      const {data,error}=await sb.storage.from(CFG.bucket).createSignedUrls(caminhos.slice(i,i+500),21600);
      if(error)throw error;(data||[]).forEach(x=>{if(x.signedUrl)ASSIN[x.path]=x.signedUrl;});
    }
    assinEm=Date.now();
  })().finally(()=>{assinando=null;});
}

// título a partir do nome do arquivo: tira extensão, números de upload, sublinhados e marcas de site
function tituloDoArquivo(n){
  let t=n.replace(/\.pdf$/i,'').replace(/\+/g,' ').replace(/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}/gi,'').replace(/^\d{6,}[-_ ]*/,'').replace(/[-_ ]?\d{6,}([-_]\d+)*/g,'');
  t=/\s/.test(t.replace(/_/g,''))&&!/^[^\s]*$/.test(t)?t.replace(/_+/g,' '):t.replace(/[-_]+/g,' ');
  t=t.replace(/^(byld|ilide[. ]info|toaz?[. ]?info|DIGITAL[ _]DOWNLOAD)[\s._-]*/i,'').replace(/\b(compress(ed)?|Z-Library|z-lib\.org|Unknown)\b/gi,'').replace(/\(\s*\)/g,'');
  t=t.replace(/(\s+\d){2,}\s*$/,'').replace(/\s+/g,' ').trim().replace(/^[-.\s]+|[-.\s]+$/g,'');
  return t?t.charAt(0).toUpperCase()+t.slice(1):n;
}

// 1ª página do PDF como capa (600 px de largura, WebP), usando o mesmo pdf.js do leitor
// PDF aberto por partes: o pdf.js pede só os trechos de que precisa (essencial para arquivos de centenas de MB)
async function abrirPorPartes(pdfjs,tamanho,ler){
  const inicial=new Uint8Array(await ler(0,Math.min(tamanho,262144)));
  const t=new pdfjs.PDFDataRangeTransport(tamanho,inicial);
  // um trecho que falha não pode sumir: o pdf.js fica esperando por ele e as páginas dali em diante nunca aparecem.
  // Tenta de novo com espera crescente (até 15 s) enquanto o livro estiver aberto; sem internet, espera a conexão voltar.
  let fechado=false;t.abort=()=>{fechado=true;};
  const pedir=async(ini,fim,n)=>{
    try{const b=await ler(ini,fim);if(!fechado)t.onDataRange(ini,new Uint8Array(b));}
    catch(e){
      if(fechado)return;
      await new Promise(ok=>{const tm=setTimeout(ok,Math.min(1000*2**n,15000));if(!navigator.onLine)addEventListener('online',()=>{clearTimeout(tm);ok();},{once:true});});
      if(!fechado)pedir(ini,fim,n+1);
    }
  };
  t.requestDataRange=(ini,fim)=>{pedir(ini,fim,0);};
  return pdfjs.getDocument({range:t,length:tamanho,rangeChunkSize:524288,disableAutoFetch:true,disableStream:true}).promise;
}
const lerArquivo=f=>(ini,fim)=>f.slice(ini,fim).arrayBuffer();
// conexão travada (comum no 4G) não pode segurar o trecho para sempre: corta em 30 s e deixa tentar de novo
const lerUrl=u=>async(ini,fim)=>{
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000);
  try{
    const r=await fetch(u,{headers:{...(await cabecalhoAuth()),Range:`bytes=${ini}-${fim-1}`},signal:ac.signal});
    if(r.status!==206&&r.status!==200)throw new Error('HTTP '+r.status);
    const b=await r.arrayBuffer();
    if(r.status===206&&b.byteLength<fim-ini)throw new Error('trecho incompleto');
    return b.byteLength>fim-ini?b.slice(ini,fim):b;
  }finally{clearTimeout(tm);}
};
// 1ª página do PDF como capa (600 px de largura, WebP), usando o mesmo pdf.js do leitor
async function capaDoPdf(file){
  let doc=null;
  try{
    const pdfjs=await carregarPdfjs();
    doc=await abrirPorPartes(pdfjs,file.size,lerArquivo(file));
    const pg=await doc.getPage(1);const v=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(600/v.width,800/v.height,2)});
    const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    await pg.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;
    return await new Promise(ok=>c.toBlob(b=>ok(b?{blob:b,ext:b.type==='image/webp'?'webp':'png'}:null),'image/webp',.85));
  }catch(e){return null;}finally{if(doc)try{doc.destroy();}catch(e){}}
}
// Envio retomável (TUS) do Supabase: blocos de 6 MB, cada bloco tenta de novo até 4 vezes;
// se a conexão cair no meio, pergunta ao servidor até onde chegou e continua dali.
const BLOCO=6*1024*1024;
const b64=t=>btoa(unescape(encodeURIComponent(t)));
async function enviarRetomavel(sb,caminho,file,tipo,progresso,bucket){
  const {data}=await sb.auth.getSession();const tok=data&&data.session&&data.session.access_token;
  if(!tok)throw new Error('Sessão expirada. Saia e entre de novo como admin.');
  const base={authorization:'Bearer '+tok,apikey:CFG.supabaseAnonKey,'tus-resumable':'1.0.0'};
  const cria=await fetch(CFG.supabaseUrl+'/storage/v1/upload/resumable',{method:'POST',headers:{...base,'upload-length':String(file.size),'x-upsert':'false',
    'upload-metadata':['bucketName '+b64(bucket||CFG.bucket),'objectName '+b64(caminho),'contentType '+b64(tipo),'cacheControl '+b64('3600')].join(',')}});
  if(cria.status!==201){const t=await cria.text().catch(()=>'');throw new Error(t||('HTTP '+cria.status));}
  let url=cria.headers.get('location');if(!url)throw new Error('O servidor não devolveu o endereço do envio.');
  if(url.startsWith('/'))url=CFG.supabaseUrl+url;
  let ofs=0,tent=0;
  while(ofs<file.size){
    try{
      const r=await fetch(url,{method:'PATCH',headers:{...base,'upload-offset':String(ofs),'content-type':'application/offset+octet-stream'},body:file.slice(ofs,ofs+BLOCO)});
      if(r.status===204||r.status===200){ofs=+(r.headers.get('upload-offset')||ofs+BLOCO);tent=0;progresso&&progresso(Math.min(ofs,file.size)/file.size);continue;}
      if(r.status===409||r.status===412){throw new Error('desalinhado');}
      const t=await r.text().catch(()=>'');throw new Error(t||('HTTP '+r.status));
    }catch(e){
      if(/exceeded|too large|413|maximum/i.test(String(e.message)))throw e;
      if(++tent>4)throw e;
      await new Promise(r=>setTimeout(r,1500*tent));
      try{const h=await fetch(url,{method:'HEAD',headers:base});const o=h.headers.get('upload-offset');if(o!=null)ofs=+o;}catch(_){}
    }
  }
}
function msgErro(e){
  const m=String(e&&(e.message||e.error)||e||'');
  return /row-level|policy|permission|403|401|JWT/i.test(m)?'Sem permissão. Confira se o e-mail está na tabela admins.'
    :/exceeded|too large|413|maximum allowed size/i.test(m)?`O Supabase recusou pelo tamanho. No painel do Supabase, em Storage → Settings, suba o "Global file size limit" para ${LIMITE_MB} MB e salve.`
    :/link_compra/i.test(m)?'Falta a coluna link_compra: rode o cob.sql atualizado no Supabase.'
    :/categoria/i.test(m)?'Falta a coluna categoria: rode o cob.sql atualizado no Supabase.'
    :/Failed to fetch|NetworkError|network/i.test(m)?'A conexão caiu durante o envio. Tente de novo no Wi-Fi.':m;
}
async function enviarUm(sb,file,{titulo,autor,desc,link,capa,categoria,progresso}){
  const base=`${Date.now()}-${slug(titulo)}`;
  if(file.size>BLOCO)await enviarRetomavel(sb,`${base}.pdf`,file,'application/pdf',progresso);
  else{const up=await sb.storage.from(CFG.bucket).upload(`${base}.pdf`,file,{contentType:'application/pdf',upsert:false});if(up.error)throw up.error;progresso&&progresso(1);}
  let capaPath=null;
  const r=capa||await capaDoPdf(file);
  if(r){const up2=await sb.storage.from(CFG.bucket).upload(`${base}-capa.${r.ext}`,r.blob,{contentType:r.blob.type,upsert:false});if(!up2.error)capaPath=`${base}-capa.${r.ext}`;}
  const linha={titulo,autor:autor||null,descricao:desc||null,capa:capaPath,arquivo:`${base}.pdf`,tamanho:file.size};
  if(link)linha.link_compra=link;
  if(categoria)linha.categoria=categoria;
  const ins=await sb.from('cob_livros').insert(linha);
  if(ins.error){await sb.storage.from(CFG.bucket).remove([`${base}.pdf`].concat(capaPath?[capaPath]:[]));throw ins.error;}
}
// a capa é reduzida no aparelho antes de subir (até 600×800), para carregar rápido na estante
function reduzirCapa(file){
  return new Promise(ok=>{
    const img=new Image();img.onload=()=>{
      const esc_=Math.min(1,600/img.width,800/img.height);
      const c=document.createElement('canvas');c.width=Math.round(img.width*esc_);c.height=Math.round(img.height*esc_);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>ok(b&&b.type==='image/webp'?{blob:b,ext:'webp'}:null),'image/webp',.85);
    };img.onerror=()=>ok(null);img.src=URL.createObjectURL(file);
  }).then(r=>r||new Promise(ok=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>ok(b?{blob:b,ext:'jpg'}:null),'image/jpeg',.85);};img.onerror=()=>ok(null);img.src=URL.createObjectURL(file);}));
}
async function estanteAcao(a,v){
  if(a==='recarregar'){E.erro='';E.livros=null;render();return;}
  if(a==='abrir'){E.etapa='email';E.msg='';render();return;}

    try{const sb=await carregarSupabase();const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;E.etapa='codigo';E.ocupado=false;aviso('Confira a caixa de entrada (e o spam).');}

      const sb=await carregarSupabase();

      E.sessao=data.session;const r=await sb.rpc('e_admin');E.admin=!!r.data;E.ocupado=false;E.etapa='fechado';
      if(!E.admin){await sb.auth.signOut();E.sessao=null;E.etapa='email';aviso('Esse e-mail não está cadastrado como admin.',true);return;}
      aviso('');
    }catch(e){E.ocupado=false;aviso('Código inválido ou vencido. Peça um novo.',true);}
    return;
  }
  if(a==='sair'){const sb=await carregarSupabase();await sb.auth.signOut();E.sessao=null;E.admin=false;E.msg='';render();return;}
  if(a==='modo'){E.modo=v;E.msg='';render(true);return;}
  if(a==='cat'){E.cat=v;render(true);return;}
  if(a==='limparfiltro'){E.cat='todas';E.busca='';render(true);return;}
  if(a==='limpar'){E.lote=[];E.msg='';render(true);return;}
  if(a==='editar'){E.editando=v;E.msg='';render(true);return;}
  if(a==='cancelar'){E.editando=null;render(true);return;}
  if(a==='salvar'){
    const titulo=($('#ed-titulo').value||'').trim(), link=($('#ed-link').value||'').trim();

    try{
      const sb=await carregarSupabase();
      const dados={titulo,autor:($('#ed-autor').value||'').trim()||null,descricao:($('#ed-desc').value||'').trim()||null,link_compra:link||null};
      if($('#ed-cat'))dados.categoria=$('#ed-cat').value||null;
      const r=await sb.from('cob_livros').update(dados).eq('id',v).select();
      if(r.error)throw r.error;
      const l=E.livros.find(x=>String(x.id)===String(v));if(l){Object.assign(l,dados);delete l._cat;}
      E.editando=null;E.msg='';render(true);
    }catch(e){aviso('Não consegui salvar: '+msgErro(e),true);}
    return;
  }
  if(a==='lote'){
    const pend=E.lote.filter(x=>x.st!=='ok');if(!pend.length)return;
    const link=E.loteLink.trim();if(link&&!linkOk(link))return aviso('O link de compra precisa começar com https://',true);
    const vazio=pend.find(x=>!x.titulo.trim());if(vazio)return aviso('Há um livro sem título na lista.',true);
    E.ocupado=true;E.msg='';render(true);
    const sb=await carregarSupabase();let falhas=0;
    for(const [k,x] of pend.entries()){
      x.st='vai';x.erro='';E.msg=`Enviando ${k+1} de ${pend.length}: ${x.titulo}`;E.erroMsg=false;atualizarLote();

      catch(e){x.st='erro';x.erro=msgErro(e);falhas++;}
      atualizarLote();
    }
    E.ocupado=false;E.livros=null;
    E.msg=falhas?`${pend.length-falhas} enviado(s), ${falhas} com erro. Corrija e toque em Enviar de novo: só os que faltam vão subir.`:`Pronto: ${pend.length} livro(s) na estante.`;E.erroMsg=!!falhas;
    if(!falhas)E.lote=[];
    await carregarLivros();render(true);

    const titulo=($('#l-titulo').value||'').trim(), autor=($('#l-autor').value||'').trim(), desc=($('#l-desc').value||'').trim(), link=($('#l-link').value||'').trim();

    if(link&&!linkOk(link))return aviso('O link de compra precisa começar com https://',true);

    try{
      const sb=await carregarSupabase();
      const capa=capaImg?await reduzirCapa(capaImg):null;
      await enviarUm(sb,pdf,{titulo,autor,desc,link,capa,categoria,progresso:f=>{const m=$('#adm .msg');if(m)m.textContent=f>=1?'Gerando a capa…':`Enviando o PDF… ${Math.round(f*100)}% (não feche a página)`;}});
      E.ocupado=false;E.livros=null;E.msg='';render(true);
    }catch(e){E.ocupado=false;aviso('Não deu certo: '+msgErro(e),true);}
    return;
  }
  if(a==='remover'){
    const l=(E.livros||[]).find(x=>String(x.id)===String(v));if(!l)return;
    if(!confirm(`Remover "${l.titulo}" da estante? Ninguém vai mais conseguir ler nem baixar.`))return;
    try{

      E.livros=null;render();
    }catch(e){aviso('Não consegui remover: '+String(e&&e.message||''),true);}
  }
}

function telaLer(r){
  const l=(E.livros||[]).find(x=>String(x.id)===String(r[1]));
  if(!l){if(E.livros===null&&!E.erro)carregarLivros();return `<div class="leitor"><div class="lbar"><button data-act="voltar" data-v="estante" aria-label="Voltar">${I.back}</button><span class="lt">Estante</span></div><p class="lmsg">${E.erro?esc(E.erro):'Abrindo a estante…'}</p></div>`;}
  return `<div class="leitor">
    <div class="lbar">
      <button data-act="voltar" data-v="estante" aria-label="Voltar para a estante">${I.back}</button>
      <span class="lt" title="${esc(l.titulo)}">${esc(l.titulo)}</span>
      <span class="lpag" id="lpag">…</span>
      <button data-act="zoom" data-v="-" aria-label="Diminuir">${I.menos}</button>
      <button data-act="zoom" data-v="+" aria-label="Aumentar">${I.mais}</button>
      <a href="${esc(urlBaixar(l.arquivo,slug(l.titulo)+'.pdf'))}" data-baixar="${l.id}" target="_blank" rel="noopener" aria-label="Baixar PDF">${I.down}</a>
    </div>
    <div class="lpaginas" id="lpaginas"><p class="lmsg">Carregando o livro…</p></div>
  </div>`;
}
async function iniciarLeitor(id){
  const l=(E.livros||[]).find(x=>String(x.id)===String(id));if(!l)return;
  const ticket=++leitor.ticket;leitor.ativo=true;leitor.id=id;leitor.zoom=(S.leitura[id]&&S.leitura[id].zoom)||1;
  const cont=$('#lpaginas');
  try{
    await carregarSupabase();
    const pdfjs=await carregarPdfjs();
    // por partes quando o tamanho é conhecido: o celular baixa só as páginas que aparecem na tela
    const u=urlAuth(l.arquivo), inteiro=async()=>pdfjs.getDocument({url:u,httpHeaders:await cabecalhoAuth()}).promise;
    const doc=l.tamanho?await abrirPorPartes(pdfjs,l.tamanho,lerUrl(u)).catch(inteiro):await inteiro();
    if(ticket!==leitor.ticket)return doc.destroy();
    leitor.doc=doc;
    await montarPaginas(ticket);
    registrarLeitura(id,'ler');
    const salva=(S.leitura[id]&&S.leitura[id].pagina)||1;
    if(salva>1){const el=leitor.paginas[salva-1];if(el)el.scrollIntoView({block:'start'});}
  }catch(e){
    console.error('leitor:',e);
    if(cont)cont.innerHTML=`<p class="lmsg">${navigator.onLine?'Não consegui abrir este PDF aqui. Use a seta para baixar.':'Sem internet. Para ler sem conexão, baixe o PDF pela seta.'}</p>`;
  }
}
async function montarPaginas(ticket){
  const doc=leitor.doc, cont=$('#lpaginas');if(!doc||!cont)return;
  if(leitor.obs)leitor.obs.disconnect();
  const larg=Math.min(cont.clientWidth-16,900)*leitor.zoom;
  const p1=await doc.getPage(1);const v1=p1.getViewport({scale:1});leitor.base=larg/v1.width;
  cont.innerHTML='';leitor.paginas=[];
  for(let n=1;n<=doc.numPages;n++){
    const d=document.createElement('div');d.className='pg';d.dataset.n=n;d.style.width=larg+'px';d.style.height=Math.round(v1.height*leitor.base)+'px';
    d.innerHTML=`<span class="num">${n}</span>`;cont.appendChild(d);leitor.paginas.push(d);
  }
  leitor.obs=new IntersectionObserver(es=>{
    es.forEach(e=>{const d=e.target;if(e.isIntersecting){if(!d.dataset.ok)desenhar(+d.dataset.n,ticket);}else if(d.dataset.ok&&Math.abs(e.boundingClientRect.top)>innerHeight*4){const c=d.querySelector('canvas');if(c)c.remove();delete d.dataset.ok;}});
    atualizarPagina();
  },{rootMargin:'120% 0px'});
  leitor.paginas.forEach(d=>leitor.obs.observe(d));
}
async function desenhar(n,ticket){
  const d=leitor.paginas[n-1];if(!d||d.dataset.ok||d.dataset.rodando)return;d.dataset.rodando='1';
  try{
    const pg=await leitor.doc.getPage(n);if(ticket!==leitor.ticket)return;
    const dpr=Math.min(devicePixelRatio||1,2.5);const vp=pg.getViewport({scale:leitor.base*dpr});
    const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    d.style.height=Math.round(vp.height/dpr)+'px';
    await pg.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;
    if(ticket!==leitor.ticket)return;
    d.insertBefore(c,d.firstChild);d.dataset.ok='1';
  }finally{delete d.dataset.rodando;}
}
let tPag=null;
function atualizarPagina(){
  clearTimeout(tPag);tPag=setTimeout(()=>{
    if(!leitor.doc)return;
    const meio=innerHeight/2;let atual=1;
    for(const d of leitor.paginas){const r=d.getBoundingClientRect();if(r.top<=meio)atual=+d.dataset.n;else break;}
    const el=$('#lpag');if(el)el.textContent=`${atual} / ${leitor.doc.numPages}`;
    S.leitura[leitor.id]={pagina:atual,zoom:leitor.zoom,em:Date.now()};salvar();
  },150);
}
function fecharLeitor(){
  leitor.ticket++;leitor.ativo=false;if(leitor.obs)leitor.obs.disconnect();leitor.obs=null;
  if(leitor.doc){try{leitor.doc.destroy();}catch(e){}}leitor.doc=null;leitor.paginas=[];
}
async function zoomLeitor(dir){
  if(!leitor.doc)return;
  const passos=[0.7,0.85,1,1.25,1.5,2];let i=passos.indexOf(leitor.zoom);if(i<0)i=2;
  i=Math.max(0,Math.min(passos.length-1,i+(dir==='+'?1:-1)));if(passos[i]===leitor.zoom)return;
  const pagina=(S.leitura[leitor.id]&&S.leitura[leitor.id].pagina)||1;
  leitor.zoom=passos[i];await montarPaginas(leitor.ticket);
  const el=leitor.paginas[pagina-1];if(el)el.scrollIntoView({block:'start'});
}
window.addEventListener('scroll',()=>{if(leitor.ativo)atualizarPagina();},{passive:true});

// ---------- Lua (calendário) ----------
function telaLua(r){
  const hoje=new Date();
  let [ano,mes]=(r[1]||'').split('-').map(Number);
  if(!ano||!mes){ano=hoje.getFullYear();mes=hoje.getMonth()+1;}
  const ini=new Date(ano,mes-1,1), fim=new Date(ano,mes,0,23,59,59);
  const fases=L.fasesEntre(new Date(ano,mes-1,1),new Date(ano,mes,1));
  const sabas=L.sabas(ano,S.hemisferio).filter(s=>s.data.getMonth()===mes-1);
  const sel=r[2]?+r[2]:(hoje.getFullYear()===ano&&hoje.getMonth()===mes-1?hoje.getDate():1);
  const ant=mes===1?`${ano-1}-12`:`${ano}-${mes-1}`, prox=mes===12?`${ano+1}-1`:`${ano}-${mes+1}`;
  const ilumFase={nova:0,'quarto-crescente':.5,cheia:1,'quarto-minguante':.5};
  const celulas=[];
  for(let i=0;i<ini.getDay();i++)celulas.push('<button class="out" tabindex="-1" aria-hidden="true"></button>');
  for(let d=1;d<=fim.getDate();d++){
    const f=fases.find(x=>x.data.getDate()===d&&x.data.getMonth()===mes-1);
    const sb=sabas.find(x=>x.data.getDate()===d);
    const ehHoje=hoje.getFullYear()===ano&&hoje.getMonth()===mes-1&&hoje.getDate()===d;
    celulas.push(`<button data-act="dia" data-v="${d}" class="${ehHoje?'hoje':''} ${d===sel?'sel':''}" aria-label="${d} de ${MESES[mes-1]}${f?', '+B.lua[f.fase].nome:''}${sb?', '+B.sabas[sb.id].nome:''}"><span>${d}</span>${f?luaSvg(ilumFase[f.fase],CRESCE.has(f.fase),18):''}${sb?'<i class="dot"></i>':''}</button>`);
  }
  // detalhes do dia escolhido
  const dsel=new Date(ano,mes-1,sel,12), lua=luaDoDia(dsel);
  const fSel=fases.find(x=>x.data.getDate()===sel), sbSel=sabas.find(x=>x.data.getDate()===sel), diaSem=B.dias[dsel.getDay()];
  const lista=fases.map(f=>`<div style="display:flex;align-items:center;gap:12px">${luaSvg(ilumFase[f.fase],CRESCE.has(f.fase),26)}<span style="flex:1">${esc(B.lua[f.fase].nome)}</span><span style="color:var(--muted);font-size:14px">${f.data.getDate()}/${f.data.getMonth()+1} · ${hora(f.data)}</span></div>`).join('');
  return `
  <div><div class="eyebrow">Calendário lunar</div><h1 class="h1" style="margin-top:6px">Lua</h1></div>
  <div class="pills" style="margin:0;padding:0"><button class="pill ${S.hemisferio!=='norte'?'on':''}" data-act="hemi" data-v="sul">Hemisfério sul</button><button class="pill ${S.hemisferio==='norte'?'on':''}" data-act="hemi" data-v="norte">Hemisfério norte</button></div>
  <div class="card">
    <div class="calhead"><button data-act="mes" data-v="${ant}" aria-label="Mês anterior">${I.back}</button><h2 class="h2" style="text-transform:capitalize">${MESES[mes-1]} ${ano}</h2><button data-act="mes" data-v="${prox}" aria-label="Próximo mês">${I.chev}</button></div>
    <div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="wd">${x}</span>`).join('')}${celulas.join('')}</div>
    <div class="legend"><span>${luaSvg(0,true,14)} Nova</span><span>${luaSvg(.5,true,14)} Quarto crescente</span><span>${luaSvg(1,true,14)} Cheia</span><span>${luaSvg(.5,false,14)} Quarto minguante</span><span><i class="dot" style="position:static;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--caramel)"></i> Sabá</span></div>
  </div>
  <div class="night">
    ${luaSvg(lua.ilum,lua.crescendo,72)}
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <div class="eyebrow">${sel} de ${MESES[mes-1]} · ${esc(diaSem.nome)}</div>
      <div class="serif" style="font-size:24px">${esc(lua.info.nome)}${fSel?` às ${hora(fSel.data)}`:''}</div>
      <p style="font-size:14px">${esc(lua.info.texto)}</p>
      <p style="font-size:13px;opacity:.85">Dia de ${esc(diaSem.planeta)}: ${esc(diaSem.temas.join(', '))}.</p>
    </div>
  </div>
  ${sbSel?`<button class="row" data-go="item/sabas/${sbSel.id}"><span class="ic">${I.roda}</span><span class="t"><span class="n">${esc(B.sabas[sbSel.id].nome)}</span><span class="s">${esc(B.sabas[sbSel.id].subtitulo)}${sbSel.astronomico?' · '+hora(sbSel.data):''}</span></span><span class="chev">${I.chev}</span></button>`:''}
  <div class="card"><div class="eyebrow">Fases do mês</div>${lista||'<p>—</p>'}</div>
  ${sabas.length?`<div class="card"><div class="eyebrow">Sabás do mês</div>${sabas.map(s=>`<div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(B.sabas[s.id].nome)}</b><span style="color:var(--muted);font-size:14px">${dataLonga(s.data)}${s.astronomico?' · '+hora(s.data):''}</span></div>`).join('')}</div>`:''}
  <footer class="note">Horários no fuso do seu aparelho, calculados com os algoritmos astronômicos de Jean Meeus.</footer>`;
}

render();
iniciarConta();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
})();
</script>
