<div class="slide">
  {{#imagem}}<img class="bg" src="{{imagem}}" alt="">{{/imagem}}{{^imagem}}<div class="bg-fallback"></div>{{/imagem}}
  {{{doodles}}}
  <div class="bloco" style="left:88px; top:120px; gap:0;">
    <div class="linha bold lg brush" style="margin-left:40px;">{{cta_linha1}}</div>
    <div class="linha script xxxl brush light" data-text="{{cta_destaque}}" style="margin-top:-30px;">{{cta_destaque}}</div>
    <div class="linha bold sm ink brush light" style="margin-top:-22px; margin-left:70px;">{{cta_linha2}}</div>
  </div>
  <div class="bloco direita" style="right:56px; bottom:120px; gap:0;">
    <div class="linha bold lg brush" style="margin-right:60px;">{{share_linha1}}</div>
    <div class="linha script lg brush light" data-text="{{share_destaque}}" style="margin-top:-18px;">{{share_destaque}}</div>
    <div class="linha bold sm ink brush light" style="margin-top:-14px; margin-right:40px;">{{share_linha2}}</div>
    <div class="linha script xxl brush light" data-text="{{share_final}}" style="margin-top:-16px; margin-right:30px;">{{share_final}}</div>
  </div>
